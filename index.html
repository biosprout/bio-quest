<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BIO QUEST 生物知識チェック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1A17;--panel:#16261F;--panel2:#1D3229;
    --primary:#2ED598;--primary-dark:#17A776;--accent:#FFC24B;
    --danger:#FF6B7A;--text:#EAF5F0;--sub:#8AA79A;--border:#25443A;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Sans JP',system-ui,sans-serif;color:var(--text);
    background:radial-gradient(circle at 20% 0%,#17362B 0%,#0E1A17 55%);min-height:100dvh;display:flex;justify-content:center}
  .app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;position:relative}
  .topbar{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg,#0E1A17 70%,rgba(14,26,23,0))}
  .brand .logo{font-family:'Poppins';font-weight:800;font-size:23px;letter-spacing:-.5px;color:var(--primary)}
  .brand .logo span{color:var(--accent)}
  .brand .sub{font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}
  .rankpill{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;color:var(--accent)}
  .screen{flex:1;overflow-y:auto;padding:6px 20px 40px;-webkit-overflow-scrolling:touch}
  .statcard{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:92px;height:92px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .in b{font-family:'Poppins';font-size:23px;font-weight:800;color:var(--primary);line-height:1}
  .ring .in small{font-size:9px;color:var(--sub);font-weight:600;margin-top:2px}
  .stinfo h2{font-size:15px;font-weight:900;margin-bottom:8px}
  .stinfo .row{display:flex;gap:16px}
  .stinfo .row div{font-size:11px;color:var(--sub);font-weight:600}
  .stinfo .row b{display:block;font-family:'Poppins';font-size:19px;color:var(--text);font-weight:700}
  .label{font-size:12px;font-weight:800;color:var(--sub);margin:10px 2px 10px;letter-spacing:.3px}
  .lvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
  .lvbtn{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:.15s}
  .lvbtn:active{transform:scale(.97)}
  .lvbtn .n{font-size:13px;font-weight:900;display:block}
  .lvbtn .d{font-size:9px;color:var(--sub);font-weight:600;margin-top:3px;display:block}
  .lvbtn.on{background:var(--primary);border-color:var(--primary);color:#08201A}
  .lvbtn.on .d{color:rgba(8,32,26,.7)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .fbtn{background:var(--panel);border:1.5px solid var(--border);border-radius:15px;padding:14px;cursor:pointer;transition:.15s;text-align:left}
  .fbtn:active{transform:scale(.98)}
  .fbtn .ic{font-size:20px}
  .fbtn .n{font-size:13px;font-weight:800;margin-top:5px}
  .fbtn .m{font-size:10px;color:var(--sub);font-weight:600;margin-top:3px}
  .fbtn .bar{height:4px;background:var(--border);border-radius:99px;margin-top:8px;overflow:hidden}
  .fbtn .bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
  .btn{border:none;border-radius:14px;font-family:inherit;font-weight:800;font-size:15px;padding:15px;cursor:pointer;transition:.15s;width:100%}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--primary);color:#08201A}
  .btn-ghost{background:var(--panel);color:var(--primary);border:1.5px solid var(--border)}
  .btn-accent{background:var(--accent);color:#2A1D00}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);font-weight:700;font-size:14px;cursor:pointer;padding:6px 2px;margin-bottom:6px;font-family:inherit}
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .qhead .left{display:flex;align-items:center;gap:10px}
  .qhead h2{font-size:16px;font-weight:900}
  .timer{font-family:'Poppins';font-weight:800;font-size:20px;color:var(--accent)}
  .timer.warn{color:var(--danger)}
  .combo{font-family:'Poppins';font-weight:800;font-size:13px;color:var(--accent)}
  .bar-top{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .bar-top i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
  .qcard{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .qmeta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tagf{font-size:10px;font-weight:800;color:var(--primary);letter-spacing:.4px}
  .taglv{font-size:9px;padding:3px 8px;border-radius:7px;font-weight:800}
  .taglv.easy{background:#123D31;color:#4FE3AC}
  .taglv.std{background:#3A3218;color:var(--accent)}
  .taglv.hard{background:#3D1D22;color:var(--danger)}
  .taglv.ibo{background:#2A1A3D;color:#C78BFF}
  .lvbtn .n{font-size:12px}
  .qtext{font-size:17px;font-weight:700;line-height:1.55}
  .choices{display:grid;gap:9px}
  .choice{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;font-family:inherit;font-size:15px;font-weight:700;
    color:var(--text);cursor:pointer;text-align:left;transition:.12s;line-height:1.45}
  .choice:active{transform:scale(.99)}
  .choice.correct{background:var(--primary);border-color:var(--primary);color:#08201A}
  .choice.wrong{background:var(--danger);border-color:var(--danger);color:#2A0009}
  .choice.dim{opacity:.4}
  .exp{border-radius:14px;padding:15px;margin-top:12px;font-size:13px;line-height:1.65;background:var(--panel2);border:1px solid var(--border)}
  .exp b{color:var(--primary)}
  .result{text-align:center;padding:26px 10px}
  .result .rank{font-family:'Poppins';font-size:62px;font-weight:800;line-height:1;color:var(--accent)}
  .result .emoji{font-size:48px;margin-bottom:4px}
  .result .big{font-family:'Poppins';font-size:44px;font-weight:800;color:var(--primary);line-height:1;margin-top:6px}
  .result h2{font-size:18px;font-weight:900;margin:10px 0 4px}
  .result p{color:var(--sub);font-weight:600;font-size:13px;margin-bottom:6px}
  .misslist{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:4px;margin:14px 0;max-height:260px;overflow-y:auto}
  .misslist .r{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5}
  .misslist .r:last-child{border:none}
  .misslist .r .q{font-weight:700;margin-bottom:4px}
  .misslist .r .a{color:var(--primary);font-weight:700;font-size:12px}
  .row2{display:flex;gap:10px}
  .row2 .btn{flex:1}
  .help{font-size:11px;color:var(--sub);line-height:1.6;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:12px 22px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .pop{position:fixed;inset:0;pointer-events:none;z-index:40}
  .pop span{position:absolute;left:50%;top:45%;font-size:24px;animation:fly .8s ease-out forwards}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="logo">BIO <span>QUEST</span></div><div class="sub">生物知識チェック / 高校〜大学</div></div>
    <div class="rankpill" id="rankPill">総合 --</div>
  </div>
  <div class="screen" id="screen"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const STORE_KEY='bioquest_chihoko_v1';
let mem=null;
const FIELDS=[
  ['cell','細胞・細胞小器官'],
  ['meta','代謝・酵素'],
  ['gene','遺伝・遺伝子'],
  ['mol','分子生物学'],
  ['body','動物の体・生理'],
  ['plant','植物の生理'],
  ['eco','生態・環境'],
  ['evo','進化・分類']
];
const Q=[
  {id:'c_e1',f:'cell',lv:'easy',q:'原核細胞に「ない」ものはどれか。',ch:['細胞膜','リボソーム','核膜','DNA'],a:2,ex:'原核細胞は核膜に包まれた核をもたない。DNAは細胞質中に存在する。リボソームは原核・真核ともにある。'},
  {id:'c_e2',f:'cell',lv:'easy',q:'ミトコンドリアの主な働きはどれか。',ch:['タンパク質合成','光合成','呼吸によるATP合成','老廃物の分解'],a:2,ex:'ミトコンドリアは酸素を使った呼吸でATPを合成する。内膜のクリステで電子伝達系が働く。'},
  {id:'c_e3',f:'cell',lv:'easy',q:'植物細胞にあって動物細胞に「ない」構造はどれか。',ch:['細胞壁','ミトコンドリア','ゴルジ体','小胞体'],a:0,ex:'細胞壁と葉緑体、発達した液胞は植物細胞の特徴。細胞壁の主成分はセルロース。'},
  {id:'c_e4',f:'cell',lv:'easy',q:'細胞膜の主要な構成成分はどれか。',ch:['セルロース','リン脂質','デンプン','キチン'],a:1,ex:'細胞膜はリン脂質二重層にタンパク質が埋め込まれた構造(流動モザイクモデル)。'},
  {id:'c_e5',f:'cell',lv:'easy',q:'タンパク質を合成する細胞小器官はどれか。',ch:['リソソーム','リボソーム','中心体','液胞'],a:1,ex:'リボソームはmRNAの情報をもとにアミノ酸をつないでタンパク質を合成する。'},
  {id:'c_e6',f:'cell',lv:'easy',q:'ゴルジ体の主な働きはどれか。',ch:['ATP合成','タンパク質の修飾と輸送','光合成','DNA複製'],a:1,ex:'ゴルジ体は小胞体で作られたタンパク質に糖鎖などの修飾を加え、分泌小胞として送り出す。'},
  {id:'c_e7',f:'cell',lv:'easy',q:'細胞分裂で染色体が両極へ移動する時期はどれか。',ch:['前期','中期','後期','終期'],a:2,ex:'後期に姉妹染色分体が分離し、紡錘糸に引かれて両極へ移動する。'},
  {id:'c_e8',f:'cell',lv:'easy',q:'高張液に動物細胞を入れるとどうなるか。',ch:['膨張して破裂する','収縮する','変化しない','分裂する'],a:1,ex:'細胞外の浸透圧が高いと水が外へ出て細胞は収縮する。植物細胞では原形質分離が起こる。'},
  {id:'c_s1',f:'cell',lv:'std',q:'細胞骨格のうち、細胞分裂の紡錘糸を形成するものはどれか。',ch:['アクチンフィラメント','中間径フィラメント','微小管','コラーゲン繊維'],a:2,ex:'微小管はチューブリンからなり、紡錘糸・繊毛・鞭毛の構成要素となる。'},
  {id:'c_s2',f:'cell',lv:'std',q:'リソソームに含まれる酵素の特徴として正しいものはどれか。',ch:['至適pHは中性','加水分解酵素で酸性で働く','ATPを合成する','光を吸収する'],a:1,ex:'リソソームは内部が酸性(pH5前後)に保たれ、各種の加水分解酵素が働いて細胞内消化を行う。'},
  {id:'c_s3',f:'cell',lv:'std',q:'ナトリウムポンプ（Na+/K+-ATPase）の働きとして正しいものはどれか。',ch:['Na+を細胞内へ、K+を細胞外へ','Na+を細胞外へ、K+を細胞内へ','両方とも細胞外へ','濃度勾配に従って輸送する'],a:1,ex:'ATPを消費してNa+を細胞外へ3個、K+を細胞内へ2個運ぶ能動輸送。静止電位の維持に関わる。'},
  {id:'c_s4',f:'cell',lv:'std',q:'細胞周期でDNAの複製が起こる時期はどれか。',ch:['G1期','S期','G2期','M期'],a:1,ex:'S期(synthesis)でDNAが複製され、DNA量が2倍になる。'},
  {id:'c_s5',f:'cell',lv:'std',q:'ミトコンドリアと葉緑体が独自のDNAをもつことを説明する説はどれか。',ch:['自然発生説','細胞内共生説','用不用説','中立説'],a:1,ex:'細胞内共生説。好気性細菌がミトコンドリアに、シアノバクテリアが葉緑体になったとされる。'},
  {id:'c_s6',f:'cell',lv:'std',q:'アポトーシスの説明として正しいものはどれか。',ch:['細胞の壊死','プログラムされた細胞死','細胞の異常増殖','細胞の融合'],a:1,ex:'アポトーシスは遺伝的に制御された細胞死。DNAの断片化を伴い、炎症を起こさない。'},
  {id:'c_s7',f:'cell',lv:'std',q:'細胞膜を介した受動輸送に「あてはまらない」ものはどれか。',ch:['単純拡散','浸透','促進拡散','能動輸送'],a:3,ex:'能動輸送はATPのエネルギーを使って濃度勾配に逆らって物質を運ぶ。'},
  {id:'c_h1',f:'cell',lv:'hard',q:'小胞体からゴルジ体への小胞輸送を担うコートタンパク質はどれか。',ch:['COPI','COPII','クラスリン','ダイニン'],a:1,ex:'COPIIは小胞体からゴルジ体への順行輸送、COPIは逆行輸送、クラスリンは細胞膜からのエンドサイトーシスを担う。'},
  {id:'c_h2',f:'cell',lv:'hard',q:'細胞周期のG1期からS期への移行を制御するチェックポイントで働く因子はどれか。',ch:['サイクリンD-CDK4/6','カスパーゼ','テロメラーゼ','ヒストン脱アセチル化酵素'],a:0,ex:'サイクリンD-CDK4/6複合体がRbタンパク質をリン酸化し、E2Fが遊離してS期関連遺伝子が発現する。'},
  {id:'c_h3',f:'cell',lv:'hard',q:'タンパク質を小胞体へ導くシグナル配列の性質として正しいものはどれか。',ch:['C末端の酸性アミノ酸配列','N末端の疎水性アミノ酸配列','中央部の塩基性配列','糖鎖修飾部位'],a:1,ex:'N末端の疎水性シグナル配列をSRP(シグナル認識粒子)が認識し、リボソームを小胞体膜へ導く。'},
  {id:'c_h4',f:'cell',lv:'hard',q:'細胞骨格のアクチンフィラメント上を移動するモータータンパク質はどれか。',ch:['キネシン','ダイニン','ミオシン','チューブリン'],a:2,ex:'ミオシンはアクチン上を移動する。キネシンとダイニンは微小管上を移動する。'},
  {id:'c_h5',f:'cell',lv:'hard',q:'ユビキチン-プロテアソーム系の機能として正しいものはどれか。',ch:['タンパク質の合成','タンパク質の選択的分解','DNAの複製','脂質の合成'],a:1,ex:'分解すべきタンパク質にユビキチンが付加され、プロテアソームで分解される。細胞周期制御にも関与。'},
  {id:'m_e1',f:'meta',lv:'easy',q:'酵素の主成分は何か。',ch:['脂質','タンパク質','炭水化物','核酸'],a:1,ex:'酵素の本体はタンパク質。熱やpHの変化で変性し失活する。'},
  {id:'m_e2',f:'meta',lv:'easy',q:'光合成が行われる細胞小器官はどれか。',ch:['ミトコンドリア','葉緑体','ゴルジ体','リボソーム'],a:1,ex:'葉緑体のチラコイドで光化学反応、ストロマでカルビン回路が進行する。'},
  {id:'m_e3',f:'meta',lv:'easy',q:'呼吸において最も多くのATPが生産される過程はどれか。',ch:['解糖系','クエン酸回路','電子伝達系','発酵'],a:2,ex:'電子伝達系(酸化的リン酸化)で約34ATPが生産される。解糖系とクエン酸回路は各2ATP。'},
  {id:'m_e4',f:'meta',lv:'easy',q:'解糖系が行われる場所はどこか。',ch:['細胞質基質','ミトコンドリアのマトリックス','ミトコンドリア内膜','葉緑体'],a:0,ex:'解糖系は細胞質基質で行われ、酸素を必要としない。グルコースがピルビン酸に分解される。'},
  {id:'m_e5',f:'meta',lv:'easy',q:'酵素の性質として正しいものはどれか。',ch:['反応の前後で自身が変化する','基質特異性がある','温度に影響されない','活性化エネルギーを高める'],a:1,ex:'酵素は特定の基質にのみ作用する基質特異性をもち、活性化エネルギーを下げて反応を促進する。'},
  {id:'m_e6',f:'meta',lv:'easy',q:'アルコール発酵の最終産物はどれか。',ch:['乳酸','エタノールと二酸化炭素','酢酸','メタン'],a:1,ex:'酵母によるアルコール発酵ではグルコースからエタノールとCO2が生じる。'},
  {id:'m_e7',f:'meta',lv:'easy',q:'光合成の光化学反応で水が分解されて発生する気体はどれか。',ch:['二酸化炭素','酸素','窒素','水素'],a:1,ex:'光化学系IIで水が分解(光分解)され、酸素が発生する。'},
  {id:'m_s1',f:'meta',lv:'std',q:'カルビン回路でCO2を固定する酵素はどれか。',ch:['ATP合成酵素','ルビスコ(RuBisCO)','カタラーゼ','アミラーゼ'],a:1,ex:'RuBisCOがCO2とリブロース1,5-ビスリン酸を結合させる。地球上で最も多いタンパク質とされる。'},
  {id:'m_s2',f:'meta',lv:'std',q:'クエン酸回路が行われる場所はどこか。',ch:['細胞質基質','ミトコンドリアのマトリックス','ミトコンドリア内膜','チラコイド膜'],a:1,ex:'クエン酸回路(TCA回路)はミトコンドリアのマトリックスで進行する。'},
  {id:'m_s3',f:'meta',lv:'std',q:'競争的阻害の特徴として正しいものはどれか。',ch:['基質濃度を上げても阻害は解消しない','基質と阻害物質が活性部位を奪い合う','Vmaxが低下する','酵素の立体構造を不可逆に壊す'],a:1,ex:'競争的阻害では阻害物質が基質と似た構造をもち活性部位に結合する。基質濃度を上げると阻害は緩和される。'},
  {id:'m_s4',f:'meta',lv:'std',q:'C4植物の特徴として正しいものはどれか。',ch:['CO2固定の最初の産物が3炭素化合物','葉肉細胞と維管束鞘細胞で役割分担する','夜間にCO2を固定する','光合成をしない'],a:1,ex:'C4植物は葉肉細胞でCO2をオキサロ酢酸(C4)として固定し、維管束鞘細胞でカルビン回路を回す。'},

  {id:'p_s1',f:'plant',lv:'std',q:'光周性において、花芽形成に重要なのはどれか。',ch:['明期の長さ','連続した暗期の長さ','温度','土壌の水分'],a:1,ex:'限界暗期を超える連続暗期の長さが花芽形成を決める。短日植物・長日植物の区別もこれによる。'},

  {id:'m_i3',f:'meta',lv:'ibo',q:'褐色脂肪組織で熱産生を担い、プロトン勾配を散逸させるタンパク質はどれか。',ch:['ATP合成酵素','UCP1(サーモゲニン)','シトクロムc','ヘキソキナーゼ'],a:1,ex:'UCP1はH+を内膜経由で漏出させ、酸化とリン酸化を脱共役して熱を生む。'},

  {id:'e_i7',f:'eco',lv:'ibo',q:'純一次生産量(NPP)の定義として正しいものはどれか。',ch:['総一次生産量+呼吸量','総一次生産量-生産者の呼吸量','消費者の同化量','分解者の呼吸量'],a:1,ex:'NPP = GPP - 生産者の呼吸。次の栄養段階が利用できるエネルギー量を表す。'},
  {id:'e_i8',f:'eco',lv:'ibo',q:'地球上のバイオームの分布を主に決める2つの気候要因はどれか。',ch:['年平均気温と年降水量','風速と気圧','日長と月齢','土壌pHのみ'],a:0,ex:'気温と降水量の組み合わせで、熱帯多雨林からツンドラまでのバイオームがほぼ決まる。'},
  {id:'e_i9',f:'eco',lv:'ibo',q:'標識再捕法による個体数推定の前提条件として「不適切」なものはどれか。',ch:['標識個体が集団に均一に混ざる','標識が生存や捕獲されやすさに影響しない','調査期間中に出入りや増減が少ない','標識個体だけが集まる習性をもつ'],a:3,ex:'標識が行動を変えたり、開放的な集団だったりすると推定(リンカーン法)は偏る。'},
  {id:'e_i10',f:'eco',lv:'ibo',q:'生態系サービスのうち「調整サービス」に該当するものはどれか。',ch:['食料の供給','気候調節や水質浄化','レクリエーション','土壌形成などの基盤機能'],a:1,ex:'供給・調整・文化的・基盤サービスの4分類。洪水緩和や花粉媒介も調整サービスに含まれる。'},
  {id:'v_i1',f:'evo',lv:'ibo',q:'単系統群の定義として正しいものはどれか。',ch:['似た形態をもつ種の集まり','共通祖先とその子孫の一部','共通祖先とそのすべての子孫','異なる祖先に由来する群'],a:2,ex:'単系統群(クレード)は1つの共通祖先と全子孫を含む。分岐分類学の基本単位。'},
  {id:'v_i2',f:'evo',lv:'ibo',q:'「鳥類を除いた爬虫類」のような群を何というか。',ch:['単系統群','側系統群','多系統群','姉妹群'],a:1,ex:'共通祖先を含むが子孫の一部(鳥類)を除いているため側系統。多系統は共通祖先を含まない群。'},
  {id:'v_i3',f:'evo',lv:'ibo',q:'最節約法(パーシモニー)による系統樹推定の原則はどれか。',ch:['枝の長さを最大にする','形質状態の変化回数が最少の樹形を選ぶ','種数が最多の樹形を選ぶ','化石を使わない'],a:1,ex:'進化的変化の総数を最小化する樹形を最良とする。相同形質の収れんが多いと誤りやすい。'},
  {id:'v_i4',f:'evo',lv:'ibo',q:'ハミルトン則 rb > c における r が表すものはどれか。',ch:['繁殖率','血縁度','資源量','リスク'],a:1,ex:'rは行為者と受益者の血縁度。利益bを血縁度で割り引いた値がコストcを上回ると利他行動が進化しうる。'},
  {id:'v_i5',f:'evo',lv:'ibo',q:'クジャクの雄の飾り羽が進化した主な機構はどれか。',ch:['自然選択による生存率向上','雌による配偶者選択(性選択)','遺伝的浮動','用不用'],a:1,ex:'生存には不利でも、雌の選り好みによる繁殖成功の差(異性間選択)で進化しうる。'},
  {id:'v_i6',f:'evo',lv:'ibo',q:'生物学的種概念の適用が難しい対象はどれか。',ch:['有性生殖する鳥類','無性生殖する細菌や化石種','哺乳類','昆虫の多く'],a:1,ex:'交配可能性で種を定義するため、無性生殖生物・化石・地理的に隔離された集団には適用しにくい。'},
  {id:'v_i7',f:'evo',lv:'ibo',q:'Hox遺伝子群の特徴として正しいものはどれか。',ch:['植物にのみ存在する','染色体上の並び順と体軸に沿った発現域が対応する','タンパク質をコードしない','細胞呼吸を制御する'],a:1,ex:'コリニアリティと呼ばれる。ホメオドメインをもつ転写因子として体節のアイデンティティを決める。'},
  {id:'v_i8',f:'evo',lv:'ibo',q:'送粉者と花の形態が互いに適応し合って進化する現象を何というか。',ch:['収れん','共進化','退化','隔離'],a:1,ex:'相互に選択圧をかけ合う共進化の典型例。長い距と長口吻のガの対応などが知られる。'},
  {id:'v_i9',f:'evo',lv:'ibo',q:'創始者効果の説明として正しいものはどれか。',ch:['大集団で突然変異が増える','少数個体による新集団の建設でアレル頻度が偏る','環境が生物を直接変える','雑種が必ず不稔になる'],a:1,ex:'遺伝的浮動の一形態。島嶼集団や隔離集団で特定の遺伝病頻度が高い例が知られる。'},
  {id:'v_i10',f:'evo',lv:'ibo',q:'分子時計を用いた分岐年代推定に必要な「較正」とは何か。',ch:['塩基置換速度を化石記録などの既知の分岐年代で補正すること','DNA量を測ること','形態を測定すること','染色体数を数えること'],a:0,ex:'置換速度は系統や遺伝子で異なるため、信頼できる分岐点(化石など)で速度を較正する必要がある。'}
];
const LV={easy:{n:'やさしい',d:'高校基礎'},std:{n:'標準',d:'高校発展'},hard:{n:'難しい',d:'大学初級'},ibo:{n:'IBO級',d:'代表選抜水準'}};
const FICON={cell:'🔬',meta:'⚡',gene:'🧬',mol:'🧪',body:'🫀',plant:'🌱',eco:'🌍',evo:'🦕'};

function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)return JSON.parse(raw);
    const init={stats:{},best:{}};localStorage.setItem(STORE_KEY,JSON.stringify(init));return init;
  }catch(e){if(!mem)mem={stats:{},best:{}};return mem;}
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){mem=state;}}
let state=load();
if(!state.stats)state.stats={};
if(!state.best)state.best={};
let curLv='all';

const $=id=>document.getElementById(id);
const screen=$('screen');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700)}
function pop(n){const p=document.createElement('div');p.className='pop';const e=['⭐','✨','🎉','💫','🧬'];
  for(let i=0;i<(n||8);i++){const s=document.createElement('span');s.textContent=e[i%5];
    s.style.setProperty('--dx',(Math.random()*260-130)+'px');s.style.setProperty('--dy',(-Math.random()*200-40)+'px');p.appendChild(s)}
  document.body.appendChild(p);setTimeout(()=>p.remove(),820)}
function fieldName(f){const o=FIELDS.find(x=>x[0]===f);return o?o[1]:f}
function pool(field,lv){return Q.filter(q=>(field==='all'||q.f===field)&&(lv==='all'||q.lv===lv))}
function weak(){return Q.filter(q=>{const s=state.stats[q.id];return s&&s.w>0&&s.c<=s.w})}
function rankOf(p){return p>=95?'S':p>=85?'A':p>=70?'B':p>=50?'C':'D'}

function renderHome(){
  const ids=Object.keys(state.stats);
  const solved=ids.length;
  let c=0,t=0;
  ids.forEach(k=>{c+=state.stats[k].c;t+=state.stats[k].c+state.stats[k].w});
  const rate=t?Math.round(c/t*100):0;
  const C=2*Math.PI*40,off=C*(1-solved/Q.length);
  $('rankPill').textContent='総合 '+(t?rankOf(rate):'--');
  const lvs=['all','easy','std','hard','ibo'].map(k=>{
    const n=k==='all'?'すべて':LV[k].n, d=k==='all'?'全レベル':LV[k].d;
    return `<div class="lvbtn ${curLv===k?'on':''}" onclick="setLv('${k}')"><span class="n">${n}</span><span class="d">${d}</span></div>`;
  });
  // 4つ並ぶので grid を4分割に
  const fs=FIELDS.map(([id,name])=>{
    const all=pool(id,curLv).length;
    const done=pool(id,curLv).filter(q=>state.stats[q.id]).length;
    const pct=all?Math.round(done/all*100):0;
    return `<div class="fbtn" onclick="startQuiz('${id}')"><div class="ic">${FICON[id]||'🧫'}</div>
      <div class="n">${name}</div><div class="m">${all}問中 ${done}問クリア</div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
  const wk=weak().length;
  screen.innerHTML=`
    <div class="statcard">
      <div class="ring"><svg width="92" height="92">
        <circle cx="46" cy="46" r="40" fill="none" stroke="var(--border)" stroke-width="9"/>
        <circle cx="46" cy="46" r="40" fill="none" stroke="var(--primary)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
      </svg><div class="in"><b>${solved}</b><small>/${Q.length}問</small></div></div>
      <div class="stinfo"><h2>学習のきろく</h2>
        <div class="row"><div>正答率<b>${rate}%</b></div><div>ランク<b>${t?rankOf(rate):'--'}</b></div></div></div>
    </div>
    <div class="label">🎚 難易度をえらぶ</div>
    <div class="lvrow" style="grid-template-columns:repeat(5,1fr)">${lvs.join('')}</div>
    <div class="label">⚔️ チャレンジ</div>
    <div class="row2" style="margin-bottom:10px">
      <button class="btn btn-primary" onclick="startQuiz('all')">🎲 ミックス10問</button>
      <button class="btn btn-accent" onclick="startQuiz('all',true)">⏱ タイムアタック</button>
    </div>
    ${wk?`<button class="btn btn-ghost" style="margin-bottom:10px" onclick="startQuiz('weak')">🔁 苦手だけ復習（${wk}問）</button>`:''}
    <div class="label">🧫 分野べつ</div>
    <div class="fields">${fs}</div>
    <p class="help">難易度を選ぶと、分野べつ・ミックスの出題がそのレベルにしぼられるよ。</p>`;
}
function setLv(k){curLv=k;renderHome();}

let g={list:[],i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:false,t:0,timer:null,field:'all'};
function startQuiz(field,ta){
  let list;
  if(field==='weak'){list=shuffle(weak());if(!list.length){toast('苦手はまだないよ');return;}list=list.slice(0,10);}
  else{list=pool(field,curLv);
    if(list.length<4){toast('この条件の問題が足りないよ');return;}
    list=shuffle(list).slice(0,ta?15:10);}
  g={list,i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:!!ta,t:ta?20:0,timer:null,field};
  renderQuiz();
}
function renderQuiz(){
  if(g.i>=g.list.length)return finish();
  clearInterval(g.timer);
  const q=g.list[g.i];g.answered=false;
  if(g.ta)g.t=20;
  const opts=shuffle(q.ch.map((c,k)=>({c,k})));
  screen.innerHTML=`
    <button class="back" onclick="quitQuiz()">‹ もどる</button>
    <div class="qhead"><div class="left"><h2>${g.ta?'⏱ タイムアタック':'🧫 クイズ'}</h2>
      ${g.combo>=2?`<span class="combo">🔥 ${g.combo}コンボ</span>`:''}</div>
      ${g.ta?`<span class="timer" id="tm">${g.t}</span>`:`<span class="combo">${g.i+1}/${g.list.length}</span>`}</div>
    <div class="bar-top"><i style="width:${g.i/g.list.length*100}%"></i></div>
    <div class="qcard">
      <div class="qmeta"><span class="tagf">${esc(fieldName(q.f))}</span><span class="taglv ${q.lv}">${LV[q.lv].n}</span></div>
      <div class="qtext">${esc(q.q)}</div>
    </div>
    <div class="choices">${opts.map(o=>`<button class="choice" data-k="${o.k}" onclick="answer(${o.k})">${esc(o.c)}</button>`).join('')}</div>
    <div id="fb"></div>`;
  if(g.ta){g.timer=setInterval(()=>{g.t--;const el=$('tm');
    if(el){el.textContent=g.t;if(g.t<=5)el.classList.add('warn');}
    if(g.t<=0){clearInterval(g.timer);if(!g.answered)answer(-1);}},1000);}
}
function answer(k){
  if(g.answered)return;g.answered=true;clearInterval(g.timer);
  const q=g.list[g.i],ok=k===q.a;
  document.querySelectorAll('.choice').forEach(b=>{const kk=+b.dataset.k;
    if(kk===q.a)b.classList.add('correct');else if(kk===k)b.classList.add('wrong');else b.classList.add('dim');b.onclick=null;});
  const st=state.stats[q.id]||{c:0,w:0};
  if(ok){g.score++;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);st.c++;pop(g.combo>=3?14:8);}
  else{g.combo=0;g.miss.push(q);st.w++;}
  state.stats[q.id]=st;save();
  const head=k===-1?'⏰ 時間切れ':(ok?'⭕ 正解':'❌ 不正解');
  $('fb').innerHTML=`<div class="exp"><b>${head}</b>　${esc(q.ex)}</div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="next()">次へ ›</button>`;
  $('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){g.i++;renderQuiz();}
function quitQuiz(){clearInterval(g.timer);renderHome();}
function finish(){
  clearInterval(g.timer);
  const total=g.list.length,rate=Math.round(g.score/total*100),rk=rankOf(rate);
  const key=(g.field||'all')+'_'+curLv+(g.ta?'_ta':'');
  const prev=state.best[key]||0;const isBest=g.score>prev;
  if(isBest){state.best[key]=g.score;save();}
  const msg={S:'完璧！文句なし',A:'すばらしい理解度',B:'いい調子、あと少し',C:'解説を読んで固めよう',D:'まずは易しめから'}[rk];
  const miss=g.miss.length?`<div class="label" style="margin-top:4px">まちがえた問題</div>
    <div class="misslist">${g.miss.map(q=>`<div class="r"><div class="q">${esc(q.q)}</div><div class="a">正解: ${esc(q.ch[q.a])}</div></div>`).join('')}</div>`:'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="result">
      <div class="rank">${rk}</div>
      <div class="big">${g.score}<span style="font-size:22px;color:var(--sub)">/${total}</span></div>
      <h2>${msg}</h2>
      <p>正答率 ${rate}% ／ 最大 ${g.maxCombo} コンボ</p>
      ${isBest?'<p style="color:var(--accent);font-weight:800">🏅 自己ベスト更新！</p>':`<p>この条件のベスト: ${Math.max(prev,g.score)}問</p>`}
    </div>
    ${miss}
    <div class="row2" style="margin-top:8px">
      <button class="btn btn-ghost" onclick="renderHome()">ホーム</button>
      <button class="btn btn-primary" onclick="startQuiz('${g.field}',${g.ta})">もう一回</button>
    </div>`;
  if(rate>=85)setTimeout(()=>pop(18),200);
}
renderHome();
</script>
</body>
</html>
