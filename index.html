<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2ED598">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BIO QUEST">
<title>BIO QUEST 生物知識チェック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1A17;--panel:#16261F;--panel2:#1D3229;
    --primary:#2ED598;--primary-dark:#17A776;--accent:#FFC24B;
    --danger:#FF6B7A;--text:#EAF5F0;--sub:#8AA79A;--border:#25443A;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Sans JP',system-ui,sans-serif;color:var(--text);
    background:radial-gradient(circle at 20% 0%,#17362B 0%,#0E1A17 55%);min-height:100dvh;display:flex;justify-content:center}
  .app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;position:relative}
  .topbar{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg,#0E1A17 70%,rgba(14,26,23,0))}
  .brand .logo{font-family:'Poppins';font-weight:800;font-size:23px;letter-spacing:-.5px;color:var(--primary)}
  .brand .logo span{color:var(--accent)}
  .brand .sub{font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}
  .rankpill{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;color:var(--accent)}
  .screen{flex:1;overflow-y:auto;padding:6px 20px 40px;-webkit-overflow-scrolling:touch}
  .statcard{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:92px;height:92px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .in b{font-family:'Poppins';font-size:23px;font-weight:800;color:var(--primary);line-height:1}
  .ring .in small{font-size:9px;color:var(--sub);font-weight:600;margin-top:2px}
  .stinfo h2{font-size:15px;font-weight:900;margin-bottom:8px}
  .stinfo .row{display:flex;gap:16px}
  .stinfo .row div{font-size:11px;color:var(--sub);font-weight:600}
  .stinfo .row b{display:block;font-family:'Poppins';font-size:19px;color:var(--text);font-weight:700}
  .label{font-size:12px;font-weight:800;color:var(--sub);margin:10px 2px 10px;letter-spacing:.3px}
  .lvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
  .lvbtn{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:.15s}
  .lvbtn:active{transform:scale(.97)}
  .lvbtn .n{font-size:13px;font-weight:900;display:block}
  .lvbtn .d{font-size:9px;color:var(--sub);font-weight:600;margin-top:3px;display:block}
  .lvbtn.on{background:var(--primary);border-color:var(--primary);color:#08201A}
  .lvbtn.on .d{color:rgba(8,32,26,.7)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .fbtn{background:var(--panel);border:1.5px solid var(--border);border-radius:15px;padding:14px;cursor:pointer;transition:.15s;text-align:left}
  .fbtn:active{transform:scale(.98)}
  .fbtn .ic{font-size:20px}
  .fbtn .n{font-size:13px;font-weight:800;margin-top:5px}
  .fbtn .m{font-size:10px;color:var(--sub);font-weight:600;margin-top:3px}
  .fbtn .bar{height:4px;background:var(--border);border-radius:99px;margin-top:8px;overflow:hidden}
  .fbtn .bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
  .btn{border:none;border-radius:14px;font-family:inherit;font-weight:800;font-size:15px;padding:15px;cursor:pointer;transition:.15s;width:100%}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--primary);color:#08201A}
  .btn-ghost{background:var(--panel);color:var(--primary);border:1.5px solid var(--border)}
  .btn-accent{background:var(--accent);color:#2A1D00}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);font-weight:700;font-size:14px;cursor:pointer;padding:6px 2px;margin-bottom:6px;font-family:inherit}
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .qhead .left{display:flex;align-items:center;gap:10px}
  .qhead h2{font-size:16px;font-weight:900}
  .timer{font-family:'Poppins';font-weight:800;font-size:20px;color:var(--accent)}
  .timer.warn{color:var(--danger)}
  .combo{font-family:'Poppins';font-weight:800;font-size:13px;color:var(--accent)}
  .bar-top{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .bar-top i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
  .qcard{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .qmeta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tagf{font-size:10px;font-weight:800;color:var(--primary);letter-spacing:.4px}
  .taglv{font-size:9px;padding:3px 8px;border-radius:7px;font-weight:800}
  .taglv.easy{background:#123D31;color:#4FE3AC}
  .taglv.std{background:#3A3218;color:var(--accent)}
  .taglv.hard{background:#3D1D22;color:var(--danger)}
  .taglv.ibo{background:#2A1A3D;color:#C78BFF}
  .lvbtn .n{font-size:12px}
  .qtext{font-size:17px;font-weight:700;line-height:1.55}
  .choices{display:grid;gap:9px}
  .choice{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;font-family:inherit;font-size:15px;font-weight:700;
    color:var(--text);cursor:pointer;text-align:left;transition:.12s;line-height:1.45}
  .choice:active{transform:scale(.99)}
  .choice.correct{background:var(--primary);border-color:var(--primary);color:#08201A}
  .choice.wrong{background:var(--danger);border-color:var(--danger);color:#2A0009}
  .choice.dim{opacity:.4}
  .exp{border-radius:14px;padding:15px;margin-top:12px;font-size:13px;line-height:1.65;background:var(--panel2);border:1px solid var(--border)}
  .exp b{color:var(--primary)}
  .result{text-align:center;padding:26px 10px}
  .result .rank{font-family:'Poppins';font-size:62px;font-weight:800;line-height:1;color:var(--accent)}
  .result .emoji{font-size:48px;margin-bottom:4px}
  .result .big{font-family:'Poppins';font-size:44px;font-weight:800;color:var(--primary);line-height:1;margin-top:6px}
  .result h2{font-size:18px;font-weight:900;margin:10px 0 4px}
  .result p{color:var(--sub);font-weight:600;font-size:13px;margin-bottom:6px}
  .misslist{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:4px;margin:14px 0;max-height:260px;overflow-y:auto}
  .misslist .r{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5}
  .misslist .r:last-child{border:none}
  .misslist .r .q{font-weight:700;margin-bottom:4px}
  .misslist .r .a{color:var(--primary);font-weight:700;font-size:12px}
  .lvstat{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .lvstat:last-child{margin-bottom:0}
  .lvstat .ln{font-size:10px;font-weight:800;width:50px;flex:0 0 auto}
  .lvstat .ln.lv-easy{color:#4FE3AC}
  .lvstat .ln.lv-std{color:var(--accent)}
  .lvstat .ln.lv-hard{color:var(--danger)}
  .lvstat .ln.lv-ibo{color:#C78BFF}
  .lvstat .lb{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden}
  .lvstat .lb i{display:block;height:100%;border-radius:99px}
  .lvstat .lb i.lv-easy{background:#4FE3AC}
  .lvstat .lb i.lv-std{background:var(--accent)}
  .lvstat .lb i.lv-hard{background:var(--danger)}
  .lvstat .lb i.lv-ibo{background:#C78BFF}
  .lvstat .lnum{font-family:'Poppins';font-size:10px;font-weight:700;color:var(--sub);width:48px;text-align:right;flex:0 0 auto}
  .lvstat .lrate{font-family:'Poppins';font-size:10px;font-weight:800;width:34px;text-align:right;flex:0 0 auto}
  .ach-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .achb{background:var(--panel);border:1.5px solid var(--border);border-radius:12px;padding:9px 8px;opacity:.5}
  .achb.got{opacity:1;border-color:var(--accent);background:#2A2416}
  .achb .an{font-size:10px;font-weight:800;line-height:1.3}
  .achb .ad{font-size:8px;color:var(--sub);font-weight:600;margin-top:3px;line-height:1.3}
    .evr{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:7px;opacity:.45}
  .evr.got{opacity:1}
  .evr.cur{border-color:var(--accent);background:#2A2416;box-shadow:0 0 0 1.5px var(--accent) inset}
  .evr .evn{font-family:'Poppins';font-size:11px;font-weight:800;color:var(--sub);width:20px;flex:0 0 auto;text-align:right}
  .evr .eve{font-size:22px;flex:0 0 auto}
  .evr .evb{flex:1;min-width:0}
  .evr .evt{font-size:13px;font-weight:800;line-height:1.35}
  .evr .evd{font-family:'Poppins';font-size:10px;color:var(--sub);font-weight:700;margin-top:2px}
  .evr.cur .evd{color:var(--accent)}
  .zkr{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;opacity:.55}
  .zkr.got{opacity:1}
  .zke{font-size:26px;flex:0 0 auto}
  .zkb{flex:1}
  .zkn{font-size:13px;font-weight:900}
  .zkd{font-size:11px;color:var(--sub);font-weight:600;line-height:1.5;margin-top:3px}
  .zktag{font-size:8px;padding:2px 7px;border-radius:6px;font-weight:800;vertical-align:1px}
  .dupn{font-family:Poppins;font-size:10px;font-weight:800;color:var(--accent);margin-left:2px}
  .zktag.N{background:#25443A;color:#8AA79A}
  .zktag.R{background:#123D31;color:#4FE3AC}
  .zktag.SR{background:#3A2A12;color:var(--accent)}
  .zktag.H{background:#232C52;color:#9AA8FF}
  .row2{display:flex;gap:10px}
  .row2 .btn{flex:1}
  .help{font-size:11px;color:var(--sub);line-height:1.6;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:12px 22px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .pop{position:fixed;inset:0;pointer-events:none;z-index:40}
  .pop span{position:absolute;left:50%;top:45%;font-size:24px;animation:fly .8s ease-out forwards}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="logo">BIO <span>QUEST</span></div><div class="sub">生物知識チェック / 高校〜大学</div></div>
    <div class="rankpill" id="rankPill">総合 --</div>
  </div>
  <div id="updBar" style="display:none;align-items:center;gap:10px;background:var(--accent);color:#1A1400;padding:10px 14px;border-radius:12px;margin:0 0 12px;font-size:13px;font-weight:700">
    <b style="flex:1">新しいバージョンがあります</b>
    <button onclick="forceUpdate()" style="background:#1A1400;color:var(--accent);border:0;border-radius:8px;padding:7px 12px;font-weight:800;font-size:12px">更新する</button>
  </div>
  <div style="display:none">
  </div>
  <div class="screen" id="screen"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const STORE_KEY='bioquest_chihoko_v1';
let mem=null;
const FIELDS=[
  ['cell','細胞・細胞小器官'],
  ['meta','代謝・酵素'],
  ['gene','遺伝・遺伝子'],
  ['mol','分子生物学'],
  ['body','動物の体・生理'],
  ['plant','植物の生理'],
  ['eco','生態・環境'],
  ['evo','進化・分類']
];
const Q=[
  {id:'c_e1',f:'cell',lv:'easy',q:'原核細胞に「ない」ものはどれか。',ch:['細胞膜','リボソーム','核膜','DNA'],a:2,ex:'原核細胞は核膜に包まれた核をもたない。DNAは細胞質中に存在する。リボソームは原核・真核ともにある。'},
  {id:'c_e2',f:'cell',lv:'easy',q:'ミトコンドリアの主な働きはどれか。',ch:['タンパク質合成','光合成','呼吸によるATP合成','老廃物の分解'],a:2,ex:'ミトコンドリアは酸素を使った呼吸でATPを合成する。内膜のクリステで電子伝達系が働く。'},
  {id:'c_e3',f:'cell',lv:'easy',q:'植物細胞にあって動物細胞に「ない」構造はどれか。',ch:['細胞壁','ミトコンドリア','ゴルジ体','小胞体'],a:0,ex:'細胞壁と葉緑体、発達した液胞は植物細胞の特徴。細胞壁の主成分はセルロース。'},
  {id:'c_e4',f:'cell',lv:'easy',q:'細胞膜の主要な構成成分はどれか。',ch:['セルロース','リン脂質','デンプン','キチン'],a:1,ex:'細胞膜はリン脂質二重層にタンパク質が埋め込まれた構造(流動モザイクモデル)。'},
  {id:'c_e5',f:'cell',lv:'easy',q:'タンパク質を合成する細胞小器官はどれか。',ch:['リソソーム','リボソーム','中心体','液胞'],a:1,ex:'リボソームはmRNAの情報をもとにアミノ酸をつないでタンパク質を合成する。'},
  {id:'c_e6',f:'cell',lv:'easy',q:'ゴルジ体の主な働きはどれか。',ch:['ATP合成','タンパク質の修飾と輸送','光合成','DNA複製'],a:1,ex:'ゴルジ体は小胞体で作られたタンパク質に糖鎖などの修飾を加え、分泌小胞として送り出す。'},
  {id:'c_e7',f:'cell',lv:'easy',q:'細胞分裂で染色体が両極へ移動する時期はどれか。',ch:['前期','中期','後期','終期'],a:2,ex:'後期に姉妹染色分体が分離し、紡錘糸に引かれて両極へ移動する。'},
  {id:'c_e8',f:'cell',lv:'easy',q:'高張液に動物細胞を入れるとどうなるか。',ch:['膨張して破裂する','収縮する','変化しない','分裂する'],a:1,ex:'細胞外の浸透圧が高いと水が外へ出て細胞は収縮する。植物細胞では原形質分離が起こる。'},
  {id:'c_s1',f:'cell',lv:'std',q:'細胞骨格のうち、細胞分裂の紡錘糸を形成するものはどれか。',ch:['アクチンフィラメント','中間径フィラメント','微小管','コラーゲン繊維'],a:2,ex:'微小管はチューブリンからなり、紡錘糸・繊毛・鞭毛の構成要素となる。'},
  {id:'c_s2',f:'cell',lv:'std',q:'リソソームに含まれる酵素の特徴として正しいものはどれか。',ch:['至適pHは中性','加水分解酵素で酸性で働く','ATPを合成する','光を吸収する'],a:1,ex:'リソソームは内部が酸性(pH5前後)に保たれ、各種の加水分解酵素が働いて細胞内消化を行う。'},
  {id:'c_s3',f:'cell',lv:'std',q:'ナトリウムポンプ（Na+/K+-ATPase）の働きとして正しいものはどれか。',ch:['Na+を細胞内へ、K+を細胞外へ','Na+を細胞外へ、K+を細胞内へ','両方とも細胞外へ','濃度勾配に従って輸送する'],a:1,ex:'ATPを消費してNa+を細胞外へ3個、K+を細胞内へ2個運ぶ能動輸送。静止電位の維持に関わる。'},
  {id:'c_s4',f:'cell',lv:'std',q:'細胞周期でDNAの複製が起こる時期はどれか。',ch:['G1期','S期','G2期','M期'],a:1,ex:'S期(synthesis)でDNAが複製され、DNA量が2倍になる。'},
  {id:'c_s5',f:'cell',lv:'std',q:'ミトコンドリアと葉緑体が独自のDNAをもつことを説明する説はどれか。',ch:['自然発生説','細胞内共生説','用不用説','中立説'],a:1,ex:'細胞内共生説。好気性細菌がミトコンドリアに、シアノバクテリアが葉緑体になったとされる。'},
  {id:'c_s6',f:'cell',lv:'std',q:'アポトーシスの説明として正しいものはどれか。',ch:['細胞の壊死','プログラムされた細胞死','細胞の異常増殖','細胞の融合'],a:1,ex:'アポトーシスは遺伝的に制御された細胞死。DNAの断片化を伴い、炎症を起こさない。'},
  {id:'c_s7',f:'cell',lv:'std',q:'細胞膜を介した受動輸送に「あてはまらない」ものはどれか。',ch:['単純拡散','浸透','促進拡散','能動輸送'],a:3,ex:'能動輸送はATPのエネルギーを使って濃度勾配に逆らって物質を運ぶ。'},
  {id:'c_h1',f:'cell',lv:'hard',q:'小胞体からゴルジ体への小胞輸送を担うコートタンパク質はどれか。',ch:['COPI','COPII','クラスリン','ダイニン'],a:1,ex:'COPIIは小胞体からゴルジ体への順行輸送、COPIは逆行輸送、クラスリンは細胞膜からのエンドサイトーシスを担う。'},
  {id:'c_h2',f:'cell',lv:'hard',q:'細胞周期のG1期からS期への移行を制御するチェックポイントで働く因子はどれか。',ch:['サイクリンD-CDK4/6','カスパーゼ','テロメラーゼ','ヒストン脱アセチル化酵素'],a:0,ex:'サイクリンD-CDK4/6複合体がRbタンパク質をリン酸化し、E2Fが遊離してS期関連遺伝子が発現する。'},
  {id:'c_h3',f:'cell',lv:'hard',q:'タンパク質を小胞体へ導くシグナル配列の性質として正しいものはどれか。',ch:['C末端の酸性アミノ酸配列','N末端の疎水性アミノ酸配列','中央部の塩基性配列','糖鎖修飾部位'],a:1,ex:'N末端の疎水性シグナル配列をSRP(シグナル認識粒子)が認識し、リボソームを小胞体膜へ導く。'},
  {id:'c_h4',f:'cell',lv:'hard',q:'細胞骨格のアクチンフィラメント上を移動するモータータンパク質はどれか。',ch:['キネシン','ダイニン','ミオシン','チューブリン'],a:2,ex:'ミオシンはアクチン上を移動する。キネシンとダイニンは微小管上を移動する。'},
  {id:'c_h5',f:'cell',lv:'hard',q:'ユビキチン-プロテアソーム系の機能として正しいものはどれか。',ch:['タンパク質の合成','タンパク質の選択的分解','DNAの複製','脂質の合成'],a:1,ex:'分解すべきタンパク質にユビキチンが付加され、プロテアソームで分解される。細胞周期制御にも関与。'},
  {id:'m_e1',f:'meta',lv:'easy',q:'酵素の主成分は何か。',ch:['脂質','タンパク質','炭水化物','核酸'],a:1,ex:'酵素の本体はタンパク質。熱やpHの変化で変性し失活する。'},
  {id:'m_e2',f:'meta',lv:'easy',q:'光合成が行われる細胞小器官はどれか。',ch:['ミトコンドリア','葉緑体','ゴルジ体','リボソーム'],a:1,ex:'葉緑体のチラコイドで光化学反応、ストロマでカルビン回路が進行する。'},
  {id:'m_e3',f:'meta',lv:'easy',q:'呼吸において最も多くのATPが生産される過程はどれか。',ch:['解糖系','クエン酸回路','電子伝達系','発酵'],a:2,ex:'電子伝達系(酸化的リン酸化)で約34ATPが生産される。解糖系とクエン酸回路は各2ATP。'},
  {id:'m_e4',f:'meta',lv:'easy',q:'解糖系が行われる場所はどこか。',ch:['細胞質基質','ミトコンドリアのマトリックス','ミトコンドリア内膜','葉緑体'],a:0,ex:'解糖系は細胞質基質で行われ、酸素を必要としない。グルコースがピルビン酸に分解される。'},
  {id:'m_e5',f:'meta',lv:'easy',q:'酵素の性質として正しいものはどれか。',ch:['反応の前後で自身が変化する','基質特異性がある','温度に影響されない','活性化エネルギーを高める'],a:1,ex:'酵素は特定の基質にのみ作用する基質特異性をもち、活性化エネルギーを下げて反応を促進する。'},
  {id:'m_e6',f:'meta',lv:'easy',q:'アルコール発酵の最終産物はどれか。',ch:['乳酸','エタノールと二酸化炭素','酢酸','メタン'],a:1,ex:'酵母によるアルコール発酵ではグルコースからエタノールとCO2が生じる。'},
  {id:'m_e7',f:'meta',lv:'easy',q:'光合成の光化学反応で水が分解されて発生する気体はどれか。',ch:['二酸化炭素','酸素','窒素','水素'],a:1,ex:'光化学系IIで水が分解(光分解)され、酸素が発生する。発生する酸素はすべて水に由来し、二酸化炭素からではない。これは酸素の同位体で標識した実験で確かめられた。'},
  {id:'m_s1',f:'meta',lv:'std',q:'カルビン回路でCO2を固定する酵素はどれか。',ch:['ATP合成酵素','ルビスコ(RuBisCO)','カタラーゼ','アミラーゼ'],a:1,ex:'RuBisCOがCO2とリブロース1,5-ビスリン酸を結合させる。地球上で最も多いタンパク質とされる。'},
  {id:'m_s2',f:'meta',lv:'std',q:'クエン酸回路が行われる場所はどこか。',ch:['細胞質基質','ミトコンドリアのマトリックス','ミトコンドリア内膜','チラコイド膜'],a:1,ex:'クエン酸回路(TCA回路)はミトコンドリアのマトリックスで進行する。'},
  {id:'m_s3',f:'meta',lv:'std',q:'競争的阻害の特徴として正しいものはどれか。',ch:['基質濃度を上げても阻害は解消しない','基質と阻害物質が活性部位を奪い合う','Vmaxが低下する','酵素の立体構造を不可逆に壊す'],a:1,ex:'競争的阻害では阻害物質が基質と似た構造をもち活性部位に結合する。基質濃度を上げると阻害は緩和される。'},
  {id:'m_s4',f:'meta',lv:'std',q:'C4植物の特徴として正しいものはどれか。',ch:['CO2固定の最初の産物が3炭素化合物','葉肉細胞と維管束鞘細胞で役割分担する','夜間にCO2を固定する','光合成をしない'],a:1,ex:'C4植物は葉肉細胞でCO2をオキサロ酢酸(C4)として固定し、維管束鞘細胞でカルビン回路を回す。'},
  {id:'m_s5',f:'meta',lv:'std',q:'化学浸透説において、ATP合成の直接の駆動力となるものはどれか。',ch:['ATPの加水分解','膜間腔と内部のH+濃度勾配','酸素の濃度勾配','グルコースの濃度'],a:1,ex:'電子伝達系で形成されたH+の濃度勾配(プロトン駆動力)がATP合成酵素を回してATPを合成する。'},
  {id:'m_s6',f:'meta',lv:'std',q:'CAM植物の特徴として正しいものはどれか。',ch:['昼にCO2を取り込み夜に還元する','夜に気孔を開いてCO2を固定する','光合成速度が最も速い','水中でのみ生育する'],a:1,ex:'CAM植物は乾燥に適応し、夜に気孔を開いてCO2をリンゴ酸として蓄え、昼に利用する。'},
  {id:'m_s7',f:'meta',lv:'std',q:'アロステリック酵素の特徴として正しいものはどれか。',ch:['基質濃度と反応速度がミカエリス式に厳密に従う','活性部位以外に調節部位をもつ','阻害を受けない','常に最大活性を示す'],a:1,ex:'アロステリック酵素は活性部位とは別の調節部位にエフェクターが結合し、活性が変化する。S字型の曲線を示す。'},
  {id:'m_h1',f:'meta',lv:'hard',q:'ミカエリス定数Kmの意味として正しいものはどれか。',ch:['最大反応速度','最大反応速度の半分を与える基質濃度','酵素濃度','活性化エネルギー'],a:1,ex:'Kmは最大速度Vmaxの1/2に達する基質濃度。値が小さいほど基質との親和性が高い。'},
  {id:'m_h2',f:'meta',lv:'hard',q:'非競争的阻害でみられる変化として正しいものはどれか。',ch:['Kmが増大しVmaxは不変','Kmは不変でVmaxが低下','KmもVmaxも増大','どちらも変化しない'],a:1,ex:'非競争的阻害では阻害物質が活性部位以外に結合し、Vmaxが低下する。Kmは変化しない。'},
  {id:'m_h3',f:'meta',lv:'hard',q:'電子伝達系で最終的に電子を受け取る物質はどれか。',ch:['NAD+','FAD','酸素','ピルビン酸'],a:2,ex:'酸素が最終電子受容体となり、H+と結合して水を生じる。酸素がないと電子の行き場がなくなり電子伝達系が止まる。好気呼吸に酸素が必須なのはこのため。'},
  {id:'m_h4',f:'meta',lv:'hard',q:'光合成の光リン酸化のうち、循環的電子伝達で主に生じるものはどれか。',ch:['ATPのみ','NADPHのみ','ATPとNADPH','酸素'],a:0,ex:'循環的電子伝達では光化学系Iのみが働き、ATPだけが生成される。NADPHと酸素は生じない。'},
  {id:'m_h5',f:'meta',lv:'hard',q:'脂肪酸のβ酸化が行われる場所はどこか。',ch:['細胞質基質','ミトコンドリアのマトリックス','小胞体','リソソーム'],a:1,ex:'β酸化はミトコンドリアのマトリックスで進行し、脂肪酸からアセチルCoAが生じる。'},
  {id:'g_e1',f:'gene',lv:'easy',q:'メンデルの法則に「含まれない」ものはどれか。',ch:['優性の法則','分離の法則','独立の法則','ハーディ・ワインベルグの法則'],a:3,ex:'メンデルの法則は優性(顕性)・分離・独立の3つ。ハーディ・ワインベルグは集団遺伝の法則。'},
  {id:'g_e2',f:'gene',lv:'easy',q:'ヒトの体細胞の染色体数はいくつか。',ch:['23本','46本','48本','92本'],a:1,ex:'ヒトの体細胞は46本(23対)。生殖細胞は減数分裂により23本。'},
  {id:'g_e3',f:'gene',lv:'easy',q:'減数分裂の結果できる細胞の染色体数は、もとの細胞と比べてどうなるか。',ch:['同じ','半分','2倍','4倍'],a:1,ex:'減数分裂では2回の分裂で染色体数が半減し、4個の娘細胞ができる。'},
  {id:'g_e4',f:'gene',lv:'easy',q:'AaとAaを交配したときの表現型の分離比はどうなるか(Aが顕性)。',ch:['1:1','3:1','1:2:1','9:3:3:1'],a:1,ex:'AA:Aa:aa = 1:2:1 となり、表現型は顕性:潜性 = 3:1。'},
  {id:'g_e5',f:'gene',lv:'easy',q:'ヒトの性決定において、男性の性染色体の組み合わせはどれか。',ch:['XX','XY','XO','YY'],a:1,ex:'ヒトはXY型。男性がXY、女性がXX。性決定はXY型のほかに、鳥やチョウのZW型（メスがZW）、バッタなどのXO型がある。ヒトではY染色体上のSRY遺伝子が精巣への分化を決める。'},
  {id:'g_e6',f:'gene',lv:'easy',q:'DNAの塩基でアデニンと対合するものはどれか。',ch:['グアニン','シトシン','チミン','ウラシル'],a:2,ex:'DNAではA-T、G-Cが対合する。RNAではAはUと対合する。'},
  {id:'g_s1',f:'gene',lv:'std',q:'連鎖している遺伝子間で組換えが起こる現象を何というか。',ch:['独立','乗換え(交叉)','突然変異','転写'],a:1,ex:'減数分裂第一分裂前期に相同染色体が対合し、乗換えによって遺伝子の組換えが生じる。'},
  {id:'g_s2',f:'gene',lv:'std',q:'組換え価から推定できるものはどれか。',ch:['遺伝子の塩基配列','染色体上の遺伝子間の距離','遺伝子の発現量','染色体の数'],a:1,ex:'組換え価は遺伝子間の距離に比例する。これをもとに染色体地図が作られる。'},
  {id:'g_s3',f:'gene',lv:'std',q:'伴性遺伝の例として適切なものはどれか。',ch:['ABO式血液型','ヒトの赤緑色覚異常','鎌状赤血球症','ハンチントン病'],a:1,ex:'赤緑色覚異常や血友病はX染色体上の遺伝子による伴性遺伝で、男性に多く現れる。'},
  {id:'g_s4',f:'gene',lv:'std',q:'ハーディ・ワインベルグの法則が成立する条件に「あてはまらない」ものはどれか。',ch:['集団が十分大きい','自由な交配が行われる','自然選択が働く','突然変異が起こらない'],a:2,ex:'自然選択が働かないことが条件。ほかに移入・移出がないことも必要。'},
  {id:'g_s5',f:'gene',lv:'std',q:'ある形質についてAはaに対して顕性である。Aa×Aaの子で、この形質が 顕性:潜性 = 2:1 に分離した。原因として最も適切なものはどれか。',ch:['AAが致死となるため','aaが致死となるため','Aaが致死となるため','分離比は変わらない'],a:0,ex:'AAが致死なら生存個体はAa:aa=2:1で、この形質の表現型も2:1になる。このときAは、形質については顕性だが、致死性についてはホモで初めて効く潜性致死。顕性・潜性は形質ごとに決まる。代表例のハツカネズミ黄色毛(Ay)も、毛色は顕性・致死は潜性としてふるまう。なお aa が致死だと生存個体は AA:Aa=1:2 となり、どちらも顕性形質を示すので分離比そのものが現れない（全個体が同じ見た目になる）。「潜性致死」とは致死アレルがホモで初めて効くという意味で、潜性のアレル a が致死という意味ではない。'},
  {id:'g_s6',f:'gene',lv:'std',q:'三点交雑を行う主な目的はどれか。',ch:['遺伝子の塩基配列決定','3つの遺伝子の染色体上の順序と距離の決定','タンパク質の構造決定','染色体数の測定'],a:1,ex:'三点交雑では二重組換えを検出でき、3遺伝子の順序と相対距離を決定できる。'},
  {id:'g_h1',f:'gene',lv:'hard',q:'ある集団で潜性形質の頻度が0.09のとき、ハーディ・ワインベルグ平衡下での潜性遺伝子の頻度qはいくらか。',ch:['0.09','0.3','0.7','0.81'],a:1,ex:'q^2 = 0.09 より q = 0.3。p = 0.7 となる。'},
  {id:'g_h2',f:'gene',lv:'hard',q:'ゲノムインプリンティングの説明として正しいものはどれか。',ch:['DNAの塩基配列が変化する','由来する親によって遺伝子の発現が異なる','染色体数が変化する','遺伝子が重複する'],a:1,ex:'父由来か母由来かでDNAメチル化状態が異なり、片方のアレルのみが発現する現象。'},
  {id:'g_h3',f:'gene',lv:'hard',q:'連鎖地図における1センチモルガン(cM)の意味はどれか。',ch:['組換え価1%','塩基1000個分','遺伝子1個分','染色体1本分'],a:0,ex:'1cMは組換え価1%に相当する遺伝的距離を表す。組換え価は最大50%で、それ以上は独立と区別できない。また二重交叉が起こると組換えが検出されないため、遠い遺伝子間では地図距離を過小評価しやすい。'},
  {id:'g_h4',f:'gene',lv:'hard',q:'エピスタシス(上位)の説明として正しいものはどれか。',ch:['同じ遺伝子座の対立遺伝子間の関係','ある遺伝子が別の遺伝子座の発現を覆い隠す','染色体の乗換え','遺伝子の重複'],a:1,ex:'非対立遺伝子間の相互作用で、一方の遺伝子が他方の表現型の発現を抑える現象。'},
  {id:'g_h5',f:'gene',lv:'hard',q:'細胞質遺伝(母性遺伝)の原因となるものはどれか。',ch:['核内DNA','ミトコンドリアや葉緑体のDNA','リボソーム','細胞膜'],a:1,ex:'ミトコンドリアDNAは主に卵由来のため、母親からのみ伝わる母性遺伝を示す。'},
  {id:'mo_e1',f:'mol',lv:'easy',q:'DNAの二重らせん構造を提唱した研究者はだれか。',ch:['メンデル','ワトソンとクリック','ダーウィン','パスツール'],a:1,ex:'1953年、ワトソンとクリックがDNAの二重らせんモデルを発表した。'},
  {id:'mo_e2',f:'mol',lv:'easy',q:'転写によってDNAから合成されるものはどれか。',ch:['タンパク質','RNA','脂質','糖'],a:1,ex:'転写ではDNAを鋳型としてRNAが合成される。翻訳ではmRNAからタンパク質が作られる。'},
  {id:'mo_e3',f:'mol',lv:'easy',q:'コドンは何個の塩基で構成されるか。',ch:['1個','2個','3個','4個'],a:2,ex:'3個の塩基(トリプレット)が1つのアミノ酸を指定する。塩基3個の並びなら4の3乗で64通りとなり、20種類のアミノ酸を指定するのに足りる。2個では16通りで足りない。'},
  {id:'mo_e4',f:'mol',lv:'easy',q:'RNAに含まれてDNAに含まれない塩基はどれか。',ch:['アデニン','グアニン','チミン','ウラシル'],a:3,ex:'RNAではチミンのかわりにウラシル(U)が使われる。ウラシルはチミンからメチル基を除いた構造。DNAがチミンを使うのは、シトシンの脱アミノで生じたウラシルを異物として見分け、修復するためと考えられている。'},
  {id:'mo_e5',f:'mol',lv:'easy',q:'翻訳の場となる細胞小器官はどれか。',ch:['核','リボソーム','ゴルジ体','リソソーム'],a:1,ex:'リボソームでmRNAの情報がアミノ酸配列に翻訳される。'},
  {id:'mo_e6',f:'mol',lv:'easy',q:'DNAの複製様式として正しいものはどれか。',ch:['保存的複製','半保存的複製','分散的複製','非複製'],a:1,ex:'メセルソンとスタールの実験により証明された。重い窒素15Nで育てた大腸菌を14Nに移し、密度勾配遠心で観察した。1世代後にすべて中間の重さになった時点で保存的複製が否定され、2世代後に中間と軽いものが1:1になった時点で分散的複製も否定された。'},
  {id:'mo_s1',f:'mol',lv:'std',q:'岡崎フラグメントが生じる理由として正しいものはどれか。',ch:['DNAポリメラーゼが3\'→5\'方向にしか合成できないため','DNAポリメラーゼが5\'→3\'方向にしか合成できないため','RNAプライマーがないため','二重らせんがほどけないため'],a:1,ex:'DNAポリメラーゼは5\'→3\'方向にしか伸長できないため、ラギング鎖では短い断片が不連続に合成される。'},
  {id:'mo_s2',f:'mol',lv:'std',q:'真核生物のmRNA前駆体から非翻訳領域が除かれる過程を何というか。',ch:['転写','スプライシング','翻訳','複製'],a:1,ex:'イントロンが除去されエキソンが連結される。選択的スプライシングにより多様なタンパク質ができる。'},
  {id:'mo_s3',f:'mol',lv:'std',q:'ラクトースオペロンにおいて、ラクトースが存在するときに起こることはどれか。',ch:['リプレッサーがオペレーターに結合する','リプレッサーが不活性化し転写が進む','転写が完全に停止する','DNAが分解される'],a:1,ex:'ラクトース代謝産物がリプレッサーに結合して不活性化し、オペレーターから外れて転写が始まる。'},
  {id:'mo_s4',f:'mol',lv:'std',q:'PCR法で耐熱性DNAポリメラーゼが使われる理由はどれか。',ch:['反応が低温で進むため','熱変性の高温に耐える必要があるため','安価だから','RNAを合成するため'],a:1,ex:'PCRでは94度前後の熱変性を繰り返すため、Taqポリメラーゼなど耐熱性の酵素が必要。'},
  {id:'mo_s5',f:'mol',lv:'std',q:'セントラルドグマの流れとして正しいものはどれか。',ch:['タンパク質→RNA→DNA','DNA→RNA→タンパク質','RNA→DNA→タンパク質','DNA→タンパク質→RNA'],a:1,ex:'遺伝情報はDNAからRNAへ転写され、タンパク質へ翻訳される。'},
  {id:'mo_s6',f:'mol',lv:'std',q:'制限酵素の働きとして正しいものはどれか。',ch:['DNAを特定の塩基配列で切断する','DNAをつなぐ','RNAを合成する','タンパク質を分解する'],a:0,ex:'制限酵素は特定の認識配列でDNAを切断する。つなぐのはDNAリガーゼ。'},
  {id:'mo_h1',f:'mol',lv:'hard',q:'テロメラーゼの働きとして正しいものはどれか。',ch:['染色体末端を短縮する','染色体末端の反復配列を伸長する','DNAを切断する','転写を抑制する'],a:1,ex:'テロメラーゼは逆転写酵素活性をもち、テロメアを伸長する。多くの体細胞では活性が低い。'},
  {id:'mo_h2',f:'mol',lv:'hard',q:'RNA干渉(RNAi)において中心的に働く分子はどれか.',ch:['tRNA','siRNAやmiRNA','rRNA','snRNA'],a:1,ex:'二本鎖RNA由来のsiRNA/miRNAがRISC複合体を導き、標的mRNAを分解または翻訳抑制する。'},
  {id:'mo_h3',f:'mol',lv:'hard',q:'エピジェネティックな遺伝子発現制御に「該当しない」ものはどれか.',ch:['DNAのメチル化','ヒストンのアセチル化','クロマチン構造の変化','塩基配列の点突然変異'],a:3,ex:'エピジェネティクスは塩基配列を変えずに遺伝子発現を制御する仕組み。点突然変異は配列そのものの変化。'},
  {id:'mo_h4',f:'mol',lv:'hard',q:'CRISPR-Cas9でDNAを切断する部位を決めるものはどれか.',ch:['Cas9タンパク質単独','ガイドRNA','制限酵素','リガーゼ'],a:1,ex:'ガイドRNAが標的配列と相補的に結合し、Cas9を導いて二本鎖切断を起こす。'},
  {id:'mo_h5',f:'mol',lv:'hard',q:'原核生物の転写でプロモーターを認識する因子はどれか.',ch:['シグマ因子','リプレッサー','リガーゼ','ヘリカーゼ'],a:0,ex:'RNAポリメラーゼにシグマ因子が結合してホロ酵素となり、プロモーターを認識する。'},
  {id:'mo_h6',f:'mol',lv:'hard',q:'真核生物のmRNAの5\'末端に付加される構造はどれか.',ch:['ポリA尾部','キャップ構造','イントロン','プライマー'],a:1,ex:'5\'末端に7-メチルグアノシンのキャップが付き、3\'末端にはポリA尾部が付加される。'},
  {id:'b_e1',f:'body',lv:'easy',q:'ヒトの血液で酸素を運搬する成分はどれか。',ch:['白血球','赤血球','血小板','血しょう'],a:1,ex:'赤血球中のヘモグロビンが酸素と結合して運搬する。'},
  {id:'b_e2',f:'body',lv:'easy',q:'血液凝固に関わる血球成分はどれか。',ch:['赤血球','白血球','血小板','リンパ球'],a:2,ex:'血小板が傷口に集まり、フィブリンとともに血ぺいを形成する。血小板から放出された因子によりトロンビンができ、それが血しょう中のフィブリノーゲンを繊維状のフィブリンに変える。この網が血球をからめて血ぺいになる。'},
  {id:'b_e3',f:'body',lv:'easy',q:'ヒトの体内環境の調節中枢がある部位はどこか。',ch:['大脳','小脳','間脳の視床下部','延髄'],a:2,ex:'視床下部が体温・血糖・浸透圧などの恒常性を統合的に調節する。'},
  {id:'b_e4',f:'body',lv:'easy',q:'血糖値を下げるホルモンはどれか。',ch:['グルカゴン','インスリン','アドレナリン','チロキシン'],a:1,ex:'すい臓ランゲルハンス島B細胞から分泌されるインスリンが血糖値を下げる。'},
  {id:'b_e5',f:'body',lv:'easy',q:'腎臓で原尿がつくられる構造はどれか。',ch:['細尿管','糸球体とボーマンのう','集合管','ぼうこう'],a:1,ex:'糸球体でろ過された液がボーマンのうに入り原尿となる。細尿管で再吸収が行われる。'},
  {id:'b_e6',f:'body',lv:'easy',q:'神経細胞(ニューロン)で興奮が伝わる方向として正しいものはどれか。',ch:['軸索→細胞体→樹状突起','樹状突起→細胞体→軸索','軸索→樹状突起のみ','方向は決まっていない'],a:1,ex:'刺激は樹状突起で受け取られ、細胞体を経て軸索へ伝導する。1個のニューロンの内部を興奮が伝わるのが伝導、シナプスを越えて次の細胞へ伝わるのが伝達。神経伝達物質は軸索末端からのみ放出されるので、伝達は一方向にしか進まない。'},
  {id:'b_e7',f:'body',lv:'easy',q:'自律神経のうち、心拍数を上げる働きをもつのはどれか。',ch:['交感神経','副交感神経','運動神経','感覚神経'],a:0,ex:'交感神経は活動時に優位となり、心拍数増加・気管支拡張などを起こす。'},
  {id:'b_s1',f:'body',lv:'std',q:'静止電位が生じる主な要因はどれか。',ch:['Na+が細胞内に多い','K+が細胞内に多くK+チャネルが開いている','Cl-のみが移動する','電位依存性Na+チャネルが開く'],a:1,ex:'細胞内にK+が多く、静止時はK+の透過性が高いため内部が負となる。'},
  {id:'b_s2',f:'body',lv:'std',q:'活動電位の脱分極を引き起こすイオンの流れはどれか。',ch:['K+の流出','Na+の流入','Ca2+の流出','Cl-の流入'],a:1,ex:'電位依存性Na+チャネルが開いてNa+が流入し、膜電位が急激に正へ変化する。'},
  {id:'b_s3',f:'body',lv:'std',q:'体液の浸透圧が上昇したときに分泌が促進されるホルモンはどれか。',ch:['バソプレシン','インスリン','グルカゴン','パラトルモン'],a:0,ex:'脳下垂体後葉からバソプレシン(抗利尿ホルモン)が分泌され、集合管での水の再吸収を促進する。'},
  {id:'b_s4',f:'body',lv:'std',q:'獲得免疫において抗体を産生する細胞はどれか。',ch:['キラーT細胞','形質細胞(B細胞由来)','マクロファージ','好中球'],a:1,ex:'B細胞が分化した形質細胞が抗体を産生する。これを体液性免疫という。'},
  {id:'b_s5',f:'body',lv:'std',q:'酸素解離曲線が右にシフトする条件として正しいものはどれか。',ch:['CO2分圧の低下','pHの上昇','温度の上昇','2,3-BPGの減少'],a:2,ex:'温度上昇、CO2増加、pH低下(ボーア効果)で右にシフトし、酸素を放しやすくなる。'},
  {id:'b_s6',f:'body',lv:'std',q:'肝臓の働きとして「あてはまらない」ものはどれか。',ch:['尿素の合成','解毒作用','グリコーゲンの貯蔵','インスリンの分泌'],a:3,ex:'インスリンはすい臓から分泌される。肝臓は代謝・解毒・貯蔵などを担う。'},
  {id:'b_s7',f:'body',lv:'std',q:'筋収縮の滑り説において、収縮時に短くなるものはどれか。',ch:['アクチンフィラメント','ミオシンフィラメント','サルコメア(筋節)','Z膜の厚さ'],a:2,ex:'フィラメント自体の長さは変わらず、滑り込みによってサルコメアが短縮する。'},
  {id:'b_h1',f:'body',lv:'hard',q:'MHC分子(主要組織適合遺伝子複合体)の主な役割はどれか。',ch:['抗体の産生','抗原ペプチドをT細胞に提示する','血液凝固','ホルモン分泌'],a:1,ex:'MHCクラスIは全有核細胞、クラスIIは抗原提示細胞に発現し、T細胞受容体に抗原を提示する。'},
  {id:'b_h2',f:'body',lv:'hard',q:'抗体の多様性が生み出される主な仕組みはどれか。',ch:['遺伝子の重複','V(D)J組換え','染色体の倍加','転写後修飾のみ'],a:1,ex:'利根川進が解明した。V・D・J領域の遺伝子断片が再構成されることで膨大な多様性が生じる。'},
  {id:'b_h3',f:'body',lv:'hard',q:'神経伝達物質が放出されるためにシナプス前終末で必要なイオンはどれか。',ch:['Na+','K+','Ca2+','Cl-'],a:2,ex:'活動電位が終末に達すると電位依存性Ca2+チャネルが開き、Ca2+流入がシナプス小胞の融合を引き起こす。'},
  {id:'b_h4',f:'body',lv:'hard',q:'腎臓の対向流増幅系で高い浸透圧勾配をつくる部位はどれか。',ch:['糸球体','ヘンレのループ','ボーマンのう','輸入細動脈'],a:1,ex:'ヘンレのループの上行脚でNaClが能動輸送され、髄質に浸透圧勾配が形成される。'},
  {id:'b_h5',f:'body',lv:'hard',q:'2型糖尿病の主な病態として正しいものはどれか。',ch:['インスリンの絶対的欠乏','インスリン抵抗性の増大','グルカゴンの欠乏','抗体の過剰産生'],a:1,ex:'2型は標的細胞のインスリン感受性低下(抵抗性)が主体。1型は自己免疫によるB細胞破壊。'},
  {id:'p_e1',f:'plant',lv:'easy',q:'植物の気孔の開閉を行う細胞はどれか。',ch:['師部細胞','孔辺細胞','道管細胞','根毛'],a:1,ex:'一対の孔辺細胞の膨圧変化により気孔が開閉する。孔辺細胞にカリウムイオンが流入すると浸透圧が上がって吸水し、膨圧が高まる。気孔側の細胞壁が厚いため外側だけがよく伸び、細胞が湾曲して気孔が開く。'},
  {id:'p_e2',f:'plant',lv:'easy',q:'水を運ぶ管はどれか。',ch:['道管','師管','形成層','表皮'],a:0,ex:'道管は根から吸収した水と無機養分を運ぶ。師管は光合成産物を運ぶ。'},
  {id:'p_e3',f:'plant',lv:'easy',q:'植物の伸長成長を促進する植物ホルモンはどれか。',ch:['アブシシン酸','オーキシン','エチレン','サイトカイニン'],a:1,ex:'オーキシンは細胞の伸長を促進し、光屈性にも関与する。オーキシンは茎の先端から基部へ一方向に運ばれる（極性移動）。同じ濃度でも茎では促進、根では抑制になるなど、器官によって最適濃度が異なる。'},
  {id:'p_e4',f:'plant',lv:'easy',q:'果実の成熟を促進する植物ホルモンはどれか。',ch:['オーキシン','ジベレリン','エチレン','アブシシン酸'],a:2,ex:'エチレンは気体のホルモンで、果実の成熟や落葉を促進する。エチレンは気体なので、1つの果実から出たものが周囲の果実にも作用する。熟したリンゴを未熟な果物と一緒に置くと熟成が早まるのはこのため。'},
  {id:'p_e5',f:'plant',lv:'easy',q:'気孔を閉じさせ、乾燥に対応する植物ホルモンはどれか。',ch:['オーキシン','アブシシン酸','ジベレリン','エチレン'],a:1,ex:'アブシシン酸は乾燥ストレス時に気孔を閉じ、休眠を維持する。乾燥を感じるとアブシシン酸が増え、孔辺細胞からカリウムイオンが流出する。吸水力が下がって膨圧が失われ、気孔が閉じて蒸散を抑える。'},
  {id:'p_s1',f:'plant',lv:'std',q:'光周性において、花芽形成に重要なのはどれか。',ch:['明期の長さ','連続した暗期の長さ','温度','土壌の水分'],a:1,ex:'限界暗期を超える連続暗期の長さが花芽形成を決める。短日植物・長日植物の区別もこれによる。'},
  {id:'p_s2',f:'plant',lv:'std',q:'フィトクロムが吸収する光として正しいものはどれか。',ch:['紫外線のみ','赤色光と遠赤色光','緑色光のみ','X線'],a:1,ex:'フィトクロムはPr型(赤色光吸収)とPfr型(遠赤色光吸収)を相互変換し、光形態形成を制御する。'},
  {id:'p_s3',f:'plant',lv:'std',q:'種子の発芽を促進し、糊粉層でアミラーゼ合成を誘導するホルモンはどれか。',ch:['オーキシン','ジベレリン','アブシシン酸','エチレン'],a:1,ex:'ジベレリンがオオムギ種子の糊粉層に働き、アミラーゼの合成を誘導して胚乳のデンプンを分解する。'},
  {id:'p_s4',f:'plant',lv:'std',q:'重力屈性においてオーキシンが関与する仕組みとして正しいものはどれか。',ch:['茎の下側で濃度が下がる','根では低濃度で成長が促進される','根では高濃度で成長が促進される','根は重力に反応しない'],a:1,ex:'根はオーキシン感受性が高く、高濃度では成長が抑制される。そのため下側の成長が抑えられ下方へ屈曲する。'},
  {id:'p_s5',f:'plant',lv:'std',q:'被子植物の重複受精で、胚乳になるのはどれか。',ch:['受精卵(2n)','中央細胞と精細胞の融合体(3n)','珠皮','花粉管'],a:1,ex:'2個の極核と精細胞が融合して3nの胚乳核となる。もう一方の精細胞は卵細胞と受精し胚になる。'},
  {id:'e_e1',f:'eco',lv:'easy',q:'生態系において生産者にあたるものはどれか。',ch:['草食動物','肉食動物','緑色植物','菌類'],a:2,ex:'緑色植物などの光合成生物が無機物から有機物を作る生産者となる。'},
  {id:'e_e2',f:'eco',lv:'easy',q:'食物連鎖において分解者にあたるものはどれか。',ch:['植物','草食動物','細菌や菌類','肉食動物'],a:2,ex:'細菌や菌類が遺骸や排出物の有機物を無機物に分解する。'},
  {id:'e_e3',f:'eco',lv:'easy',q:'生態ピラミッドで、上位の栄養段階ほど一般に少なくなるのはなぜか。',ch:['寿命が短いから','エネルギーが移動時に大きく失われるから','繁殖しないから','移動しないから'],a:1,ex:'各栄養段階で呼吸などによりエネルギーが失われ、次段階へは10%程度しか渡らない。'},
  {id:'e_e4',f:'eco',lv:'easy',q:'個体群の成長曲線として一般的にみられる形はどれか。',ch:['直線','S字型(ロジスティック曲線)','U字型','W字型'],a:1,ex:'環境収容力に近づくと成長が鈍り、S字型のロジスティック曲線を描く。'},
  {id:'e_e5',f:'eco',lv:'easy',q:'窒素固定を行う生物はどれか。',ch:['乳酸菌','根粒菌','酵母','大腸菌'],a:1,ex:'根粒菌やアゾトバクター、シアノバクテリアが大気中のN2をアンモニアに変換する。'},
  {id:'e_s1',f:'eco',lv:'std',q:'キーストーン種の説明として正しいものはどれか。',ch:['個体数が最も多い種','生態系への影響が個体数に比して大きい種','外来種','絶滅危惧種'],a:1,ex:'ヒトデの研究(ペイン)で提唱。除去すると群集構造が大きく変化する種。'},
  {id:'e_s2',f:'eco',lv:'std',q:'competitive exclusion(競争的排除則)の説明として正しいものはどれか。',ch:['同じニッチの2種は共存できない','異なる種は必ず共存する','捕食者は必ず絶滅する','種数は常に増加する'],a:0,ex:'ガウゼの法則。生態的地位が完全に重なる2種は長期的に共存できない。'},
  {id:'e_s3',f:'eco',lv:'std',q:'r戦略の特徴として正しいものはどれか。',ch:['少数の子を手厚く育てる','多数の子を産み死亡率が高い','寿命が長い','体が大きい'],a:1,ex:'r戦略は増殖率重視で小型・多産・短命。K戦略は環境収容力付近で有利な少産・長命型。'},
  {id:'e_s4',f:'eco',lv:'std',q:'一次遷移の初期に現れる先駆植物(パイオニア)として適切なものはどれか。',ch:['陰樹','地衣類やコケ植物','陽樹の高木','つる植物'],a:1,ex:'裸地には地衣類・コケ類が侵入し、土壌形成が進むと草本・低木・陽樹・陰樹へと遷移する。'},
  {id:'e_s5',f:'eco',lv:'std',q:'生物濃縮が起こりやすい物質の特徴はどれか。',ch:['水に溶けやすく分解されやすい','脂溶性で分解されにくい','気体である','無機イオンである'],a:1,ex:'DDTやPCBのような脂溶性・難分解性の物質は体内に蓄積し、食物連鎖の上位ほど濃度が高くなる。'},
  {id:'v_e1',f:'evo',lv:'easy',q:'自然選択説を提唱した人物はだれか。',ch:['ラマルク','ダーウィン','メンデル','リンネ'],a:1,ex:'ダーウィンが「種の起源」で自然選択による進化を提唱した。'},
  {id:'v_e2',f:'evo',lv:'easy',q:'相同器官の例として適切なものはどれか。',ch:['鳥の翼と昆虫の翅','ヒトの腕とクジラの胸びれ','サボテンのとげと動物の毛','魚のえらと肺'],a:1,ex:'相同器官は起源が同じで形態や機能が異なるもの。鳥の翼と昆虫の翅は相似器官。'},
  {id:'v_e3',f:'evo',lv:'easy',q:'五界説において、キノコやカビが属する界はどれか。',ch:['原核生物界','原生生物界','菌界','植物界'],a:2,ex:'菌類は細胞壁をもつが光合成はせず、有機物を吸収する従属栄養生物で菌界に属する。'},
  {id:'v_e4',f:'evo',lv:'easy',q:'生物の分類階級で、種のすぐ上位にあたるものはどれか。',ch:['属','科','目','綱'],a:0,ex:'界→門→綱→目→科→属→種の順。種のすぐ上は属。'},
  {id:'v_s1',f:'evo',lv:'std',q:'木村資生が提唱した進化に関する説はどれか。',ch:['用不用説','中立説','自然選択説','定向進化説'],a:1,ex:'分子レベルの変異の多くは自然選択に対して中立で、遺伝的浮動により固定されるとする説。'},
  {id:'v_s2',f:'evo',lv:'std',q:'適応放散の例として適切なものはどれか。',ch:['異なる系統が似た形態になる','1つの祖先から多様な環境に適応した種が分化する','種が絶滅する','個体数が減少する'],a:1,ex:'ガラパゴスフィンチのくちばしの多様化が代表例。収れんは別系統が似る現象。'},
  {id:'v_s3',f:'evo',lv:'std',q:'分子時計の考え方として正しいものはどれか。',ch:['形態の変化速度から年代を推定する','塩基やアミノ酸の置換がほぼ一定速度で蓄積することを利用する','化石の層位のみで推定する','放射性同位体を用いる'],a:1,ex:'中立な変異が一定速度で蓄積することを利用し、系統の分岐年代を推定する。'},
  {id:'v_h1',f:'evo',lv:'hard',q:'遺伝的浮動が特に強く働くのはどのような集団か。',ch:['個体数が非常に多い集団','個体数が少ない集団','移動が活発な集団','突然変異率が低い集団'],a:1,ex:'小集団では偶然による遺伝子頻度の変動が大きい。びん首効果や創始者効果もこれに関連する。'},
  {id:'v_h2',f:'evo',lv:'hard',q:'種分化のうち、地理的隔離を伴わずに起こるものはどれか。',ch:['異所的種分化','同所的種分化','側所的種分化','周辺的種分化'],a:1,ex:'同所的種分化は同じ地域内で生態的分化や倍数化などにより生殖的隔離が生じる。'},

  {id:'mo_h7',f:'mol',lv:'hard',q:'岡崎フラグメント同士を連結する酵素はどれか。',ch:['DNAポリメラーゼ','DNAリガーゼ','ヘリカーゼ','プライマーゼ'],a:1,ex:'リガーゼがホスホジエステル結合を形成して断片をつなぐ。リガーゼが必要なのはラギング鎖側。岡崎フラグメントのRNAプライマーが除かれてできたすき間を埋めたあと、この酵素が連結する。遺伝子組換えでDNA断片をつなぐ際にも使われる。'},
  {id:'mo_h8',f:'mol',lv:'hard',q:'DNA複製の開始に必要なRNAプライマーを合成する酵素はどれか。',ch:['DNAポリメラーゼ','リガーゼ','プライマーゼ','トポイソメラーゼ'],a:2,ex:'DNAポリメラーゼは既存の3\'-OH末端がないと伸長できないため、プライマーゼが短いRNAを合成する。'},
  {id:'mo_h9',f:'mol',lv:'hard',q:'真核生物mRNAのポリA尾部の機能として「あてはまらない」ものはどれか。',ch:['mRNAの安定化','核外輸送の促進','翻訳効率の向上','DNA複製の開始'],a:3,ex:'ポリA尾部は分解からの保護・輸送・翻訳促進に働く。複製開始とは無関係。'},
  {id:'mo_h10',f:'mol',lv:'hard',q:'コドンとアンチコドンの対合の向きとして正しいものはどれか。',ch:['平行に対合する','逆平行に対合する','対合しない','ランダムな向き'],a:1,ex:'核酸の塩基対合は常に逆平行。コドン5\'→3\'に対しアンチコドンは3\'→5\'で対合する。'},
  {id:'mo_h11',f:'mol',lv:'hard',q:'サンガー法(ジデオキシ法)の原理はどれか。',ch:['ddNTPの取り込みでDNA合成が停止する','DNAを制限酵素で切る','RNAを逆転写する','抗体で検出する'],a:0,ex:'3\'-OHをもたないddNTPが取り込まれると伸長が止まり、長さの異なる断片から配列を読む。'},
  {id:'mo_h12',f:'mol',lv:'hard',q:'タンパク質を特異的に検出する解析法はどれか。',ch:['サザンブロット','ノーザンブロット','ウェスタンブロット','PCR'],a:2,ex:'サザン=DNA、ノーザン=RNA、ウェスタン=タンパク質(抗体で検出)。'},
  {id:'b_h6',f:'body',lv:'hard',q:'ボーア効果の説明として正しいものはどれか。',ch:['CO2増加やpH低下で酸素解離曲線が右へずれる','温度低下で右へずれる','酸素分圧の上昇で左へずれる','pHが上がると酸素を放しやすくなる'],a:0,ex:'代謝の活発な組織ではCO2が多くpHが低いため、Hbが酸素を放しやすくなる。'},
  {id:'b_h7',f:'body',lv:'hard',q:'静止電位の値に最も大きく寄与するイオンはどれか。',ch:['Na+','K+','Ca2+','Cl-'],a:1,ex:'静止時の膜はK+透過性が高く、静止電位はK+の平衡電位(約-90mV)に近い値をとる。'},
  {id:'b_h8',f:'body',lv:'hard',q:'有髄神経で跳躍伝導が起こる部位はどれか。',ch:['髄鞘の中央','ランビエ絞輪','シナプス小胞','細胞体'],a:1,ex:'髄鞘の切れ目であるランビエ絞輪にのみチャネルが集中し、興奮が絞輪間を跳ぶため伝導が速い。'},
  {id:'b_h9',f:'body',lv:'hard',q:'分子内にヨウ素を含むホルモンはどれか。',ch:['インスリン','チロキシン','アドレナリン','成長ホルモン'],a:1,ex:'甲状腺ホルモン(T3・T4)はヨウ素を含む。ヨウ素欠乏で甲状腺腫が生じる。'},
  {id:'b_h10',f:'body',lv:'hard',q:'血糖値を「上げる」働きをもたないホルモンはどれか。',ch:['グルカゴン','アドレナリン','糖質コルチコイド','インスリン'],a:3,ex:'血糖上昇系は複数あるが、下げるのは実質インスリンのみ。これが糖尿病の背景にある非対称性。'},
  {id:'b_h11',f:'body',lv:'hard',q:'胃でペプシノーゲンをペプシンに変換する主要因はどれか。',ch:['胆汁','塩酸による低pH','リパーゼ','すい液'],a:1,ex:'塩酸の酸性環境でペプシノーゲンが活性化され、以後は自己触媒的にも進む。'},
  {id:'b_h12',f:'body',lv:'hard',q:'二次応答が一次応答より速く強い理由はどれか。',ch:['抗原が弱くなるから','記憶細胞が残っているから','白血球が減るから','抗体が変異するから'],a:1,ex:'初回感染で形成された記憶B細胞・記憶T細胞が、再感染時に迅速に増殖・分化する。ワクチンの原理。'},
  {id:'p_h1',f:'plant',lv:'hard',q:'道管内の水が高木の頂部まで引き上げられる主因を説明する説はどれか。',ch:['根圧説のみ','蒸散凝集力説','圧流説','浸透説'],a:1,ex:'蒸散による引く力と、水分子の凝集力・道管壁への付着力で水柱が持ち上げられる。'},
  {id:'p_h2',f:'plant',lv:'hard',q:'光補償点の定義として正しいものはどれか。',ch:['光合成速度が最大になる光強度','見かけの光合成速度が0になる光強度','呼吸が止まる光強度','気孔が閉じる光強度'],a:1,ex:'光合成によるCO2吸収と呼吸によるCO2放出がつり合う光強度。'},
  {id:'p_h3',f:'plant',lv:'hard',q:'陰生植物の特徴として正しいものはどれか。',ch:['光補償点も光飽和点も高い','光補償点も光飽和点も低い','光補償点が高く光飽和点が低い','光の影響を受けない'],a:1,ex:'陰生植物は弱光でも生育できるよう補償点・飽和点ともに低い。光補償点は、見かけの光合成量が0になる（光合成量と呼吸量が等しくなる）光の強さ。陰生植物は呼吸量が小さいため、弱い光でも収支が黒字になる。'},
  {id:'p_h4',f:'plant',lv:'hard',q:'短日植物の組み合わせとして正しいものはどれか。',ch:['キクとアサガオ','コムギとホウレンソウ','トマトとキュウリ','アブラナとダイコン'],a:0,ex:'キク・アサガオ・イネ(晩生)などは短日植物。コムギ・ホウレンソウは長日植物。'},
  {id:'p_h5',f:'plant',lv:'hard',q:'光発芽種子(レタスなど)の発芽を促進する光はどれか。',ch:['遠赤色光','赤色光','緑色光','紫外線'],a:1,ex:'赤色光でPfr型が増えると発芽が促進される。直後に遠赤色光を当てると打ち消される。'},
  {id:'e_h1',f:'eco',lv:'hard',q:'総生産量・純生産量・呼吸量の関係として正しいものはどれか。',ch:['純生産量=総生産量+呼吸量','純生産量=総生産量-呼吸量','総生産量=純生産量-成長量','呼吸量=純生産量'],a:1,ex:'生産者の純生産量は総生産量から自身の呼吸量を引いたもの。さらに、成長量＝純生産量－（被食量＋枯死量）。総生産量は生産者が光合成でつくった有機物の総量を指す。'},
  {id:'e_h2',f:'eco',lv:'hard',q:'個体群密度を高くして栽培しても単位面積あたりの収量がほぼ一定になる現象を何というか。',ch:['相変異','最終収量一定の法則','群れ効果','寄生'],a:1,ex:'密度効果の一種。密度が上がると個体あたりの成長が抑えられ、面積あたり収量は頭打ちになる。'},
  {id:'e_h3',f:'eco',lv:'hard',q:'トノサマバッタで、幼虫期の高密度により群生相が生じる現象を何というか。',ch:['相変異','変態','擬態','冬眠'],a:0,ex:'密度効果による表現型の変化。群生相は翅が長く集合性・移動性が高い。'},
  {id:'e_h4',f:'eco',lv:'hard',q:'縄張り(テリトリー)の大きさが決まる原理として最も適切なものはどれか。',ch:['広いほど常に有利','利益とコストの差が最大になる大きさに落ち着く','ランダムに決まる','季節に無関係'],a:1,ex:'縄張りから得る利益(資源)と防衛コストのバランスで最適サイズが決まる。'},
  {id:'e_h5',f:'eco',lv:'hard',q:'群れをつくることの利益に「あてはまらない」ものはどれか。',ch:['捕食者の発見が早くなる','1個体あたりの警戒時間が減る','採食情報を共有できる','感染症のリスクが下がる'],a:3,ex:'群れでは感染症や寄生虫はむしろ広がりやすい。これは群れのコストの一つ。'},
  {id:'v_h4',f:'evo',lv:'hard',q:'工業暗化(オオシモフリエダシャク)が示した進化の仕組みはどれか。',ch:['用不用説','自然選択による頻度変化','定向進化','獲得形質の遺伝'],a:1,ex:'すすで黒化した樹皮では暗色型が捕食されにくく、暗色アレルの頻度が上昇した。'},
  {id:'v_h5',f:'evo',lv:'hard',q:'毒をもたない種が毒をもつ種に似る擬態を何というか。',ch:['ミュラー型擬態','ベイツ型擬態','隠蔽擬態','攻撃擬態'],a:1,ex:'ベイツ型。毒種同士が似せ合うのがミュラー型擬態。ハナアブがハチに似るのがベイツ型。毒をもつ種どうしが互いに似るミュラー型では、捕食者が一度学習すれば両種とも守られる。'},
  {id:'v_h6',f:'evo',lv:'hard',q:'接合後隔離に該当するものはどれか。',ch:['繁殖時期のずれ','求愛行動の違い','雑種の不稔','生息場所の違い'],a:2,ex:'ラバの不稔のように、交配後に雑種の生存力や繁殖力が下がるものが接合後隔離。他は接合前隔離。'},
  {id:'v_h7',f:'evo',lv:'hard',q:'鳥の翼と昆虫の翅の関係として正しいものはどれか。',ch:['相同器官','相似器官','痕跡器官','同一器官'],a:1,ex:'起源が異なるのに機能や形が似たものを相似器官という。系統が違っても似た環境では似た形に行き着く収れん進化の結果。対して、起源が同じで機能が異なるのが相同器官で、コウモリの翼とヒトの腕がその例。'},
  {id:'v_h8',f:'evo',lv:'hard',q:'示準化石の条件として最も適切なものはどれか。',ch:['特定の環境にのみ生息した','広範囲に分布し生存期間が短い','現在も生きている','ごく狭い地域にのみ産出する'],a:1,ex:'時代決定には広分布・短命の種がよい(アンモナイトなど)。環境推定に使うのが示相化石。'},
  {id:'c_i11',f:'cell',lv:'ibo',q:'小胞と標的膜の特異的な融合を保証するタンパク質はどれか。',ch:['SNARE','クラスリン','ダイニン','ラミン'],a:0,ex:'小胞側v-SNAREと標的膜t-SNAREの対合が膜融合の特異性と駆動力を与える。'},
  {id:'c_i12',f:'cell',lv:'ibo',q:'核輸送の方向性を決めるRan-GTPの分布として正しいものはどれか。',ch:['核内で高濃度','細胞質で高濃度','均一に分布','核膜にのみ存在'],a:0,ex:'RanGEFが核内、RanGAPが細胞質にあるため、Ran-GTPは核内で高い。この勾配が輸送の方向を決める。'},
  {id:'c_i13',f:'cell',lv:'ibo',q:'微小管のプラス端方向(主に細胞周辺部)へ荷物を運ぶモータータンパク質はどれか。',ch:['ダイニン','キネシン','ミオシン','コヒーシン'],a:1,ex:'キネシンはプラス端方向、ダイニンはマイナス端方向(中心体側)へ移動する。'},
  {id:'c_i14',f:'cell',lv:'ibo',q:'姉妹染色分体を束ねるコヒーシンを後期開始時に切断する酵素はどれか。',ch:['セパラーゼ','カスパーゼ','テロメラーゼ','ヘリカーゼ'],a:0,ex:'APC/Cがセキュリンを分解するとセパラーゼが活性化し、コヒーシンを切断して分体が分離する。'},
  {id:'c_i15',f:'cell',lv:'ibo',q:'紡錘体チェックポイント(SAC)が監視しているものはどれか。',ch:['DNAの複製完了','全キネトコアの紡錘糸への結合','細胞の大きさ','ATP量'],a:1,ex:'未結合のキネトコアが残る限りAPC/Cを抑制し、後期への移行を止める。染色体分配ミスを防ぐ。'},
  {id:'c_i16',f:'cell',lv:'ibo',q:'アポトーシスの実行段階で細胞内タンパク質を切断するプロテアーゼはどれか。',ch:['カスパーゼ','ペプシン','トリプシン','セパラーゼ'],a:0,ex:'開始カスパーゼが実行カスパーゼを活性化するカスケードで、DNA断片化や細胞の断片化が進む。'},
  {id:'c_i17',f:'cell',lv:'ibo',q:'Bcl-2ファミリータンパク質が制御するアポトーシスの過程はどれか。',ch:['受容体の発現','ミトコンドリア外膜の透過化とシトクロムc放出','リソソームの融合','紡錘体形成'],a:1,ex:'促進因子(Bax/Bak)と抑制因子(Bcl-2)のバランスがシトクロムc放出を決め、カスパーゼ活性化に至る。'},
  {id:'c_i18',f:'cell',lv:'ibo',q:'ギャップ結合を通過できる物質として適切なものはどれか。',ch:['タンパク質','mRNA','イオンやcAMPなどの低分子','リボソーム'],a:2,ex:'約1kDa以下の低分子が通る。心筋の興奮同期や二次メッセンジャーの共有に働く。'},
  {id:'c_i19',f:'cell',lv:'ibo',q:'インテグリンが主に結合する相手はどれか。',ch:['隣接細胞のインテグリン','フィブロネクチンなど細胞外基質','DNA','微小管'],a:1,ex:'インテグリンはRGD配列などを介して細胞外基質と結合し、細胞内では細胞骨格と連結する。'},
  {id:'c_i20',f:'cell',lv:'ibo',q:'正常細胞が培養皿で単層になると増殖を止める現象と、がん細胞の関係として正しいものはどれか。',ch:['がん細胞も同様に止まる','がん細胞は接触阻害を失い重なって増える','正常細胞は無限に増える','接触阻害は植物のみの現象'],a:1,ex:'接触阻害(密度依存性増殖停止)の喪失はがん細胞の特徴の一つ。'},
  {id:'m_i11',f:'meta',lv:'ibo',q:'電子伝達系の複合体IIIでプロトン輸送を担う機構はどれか。',ch:['Q回路','カルビン回路','尿素回路','コリ回路'],a:0,ex:'ユビキノンの酸化還元を介したQ回路により、電子2個あたり4H+が膜間腔へ運ばれる。'},
  {id:'m_i12',f:'meta',lv:'ibo',q:'ATP合成酵素の回転触媒機構で、H+の流れによって実際に回転する部分はどれか。',ch:['αサブユニット','βサブユニット','γサブユニットを含む回転子','固定子のみ'],a:2,ex:'Fo中のcリングとγ軸が回転し、βサブユニットの構造変化(binding change)でATPが合成される。'},
  {id:'m_i13',f:'meta',lv:'ibo',q:'化学浸透圧説を提唱した研究者はだれか。',ch:['クレブス','ミッチェル','カルビン','ワールブルク'],a:1,ex:'ピーター・ミッチェルが提唱し、当初は懐疑的に受け止められたが後にノーベル賞を受賞した。'},
  {id:'m_i14',f:'meta',lv:'ibo',q:'脂肪酸合成の律速酵素で、アセチルCoAをマロニルCoAに変換するものはどれか。',ch:['脂肪酸シンターゼ','アセチルCoAカルボキシラーゼ','リパーゼ','カルニチン転移酵素'],a:1,ex:'ACCが律速段階を触媒する。クエン酸で活性化されるなど代謝状態に応じて調節される。'},
  {id:'m_i15',f:'meta',lv:'ibo',q:'脂肪酸合成が行われる場所はどこか。',ch:['ミトコンドリアのマトリックス','細胞質基質','リソソーム','核'],a:1,ex:'合成は細胞質、分解(β酸化)はミトコンドリアと、場所が分けられて逆行を防いでいる。'},
  {id:'m_i16',f:'meta',lv:'ibo',q:'ミトコンドリア内のアセチルCoAを細胞質へ運び出す形はどれか。',ch:['そのまま膜を通過する','クエン酸として搬出後に再変換','グルコースに変換','CO2として'],a:1,ex:'アセチルCoA自体は内膜を通れず、クエン酸として出て細胞質でATPクエン酸リアーゼにより再生される。'},
  {id:'m_i17',f:'meta',lv:'ibo',q:'カルビン回路でCO2 1分子を固定するのに消費されるATPとNADPHの数はどれか。',ch:['ATP2, NADPH2','ATP3, NADPH2','ATP2, NADPH3','ATP1, NADPH1'],a:1,ex:'CO2 1分子あたりATP3分子とNADPH2分子。グルコース1分子なら18ATP・12NADPH。'},
  {id:'m_i18',f:'meta',lv:'ibo',q:'グリコーゲン分解のホルモン調節がカスケード反応になっている意義はどれか。',ch:['反応を遅くする','シグナルを段階的に増幅する','ATPを節約しない','酵素を分解する'],a:1,ex:'アドレナリン→cAMP→PKA→ホスホリラーゼキナーゼ→ホスホリラーゼと増幅され、微量のホルモンで大きな応答を生む。'},
  {id:'m_i19',f:'meta',lv:'ibo',q:'イソロイシン合成経路の最初の酵素がイソロイシンで阻害される調節を何というか。',ch:['基質誘導','フィードバック阻害','競争的阻害','共有結合修飾'],a:1,ex:'最終産物による経路入口の阻害(フィードバック阻害)で、過剰合成を防ぐ。トレオニンデアミナーゼが例。'},
  {id:'m_i20',f:'meta',lv:'ibo',q:'光合成の明反応で生じ、カルビン回路で使われない分子はどれか。',ch:['ATP','NADPH','酸素','G3P'],a:2,ex:'酸素は水の分解の副産物として放出される。G3Pはカルビン回路の産物であり明反応産物ではない。'},

function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)return JSON.parse(raw);
    const init={stats:{},best:{}};localStorage.setItem(STORE_KEY,JSON.stringify(init));return init;
  }catch(e){if(!mem)mem={stats:{},best:{}};return mem;}
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){mem=state;}}
let state=load();
if(!state.stats)state.stats={};
if(!state.best)state.best={};
if(state.xp==null)state.xp=0;
if(state.maxCombo==null)state.maxCombo=0;
if(!state.ach)state.ach=[];
if(!state.streak)state.streak={day:'',count:0};
if(state.taBest==null)state.taBest=0;
if(!state.cards)state.cards=[];
if(!state.cardCount){
  state.cardCount={};
  (state.cards||[]).forEach(id=>{state.cardCount[id]=(state.cardCount[id]||0)+1;});
}

function grantCard(){
  const cnt=state.cardCount||(state.cardCount={});
  const owned=id=>(cnt[id]||0)>0;
  // 未所持は重み3倍。重複も出るが新規が出やすい
  const W={N:6,R:3,SR:1,H:0};
  const build=arr=>{
    let tot=0; const w=arr.map(c=>{const v=(W[c.r]||1)*(owned(c.id)?1:3); tot+=v; return v;});
    return {arr,w,tot};
  };
  const draw=pool=>{
    const {arr,w,tot}=build(pool);
    let x=Math.random()*tot;
    for(let i=0;i<arr.length;i++){x-=w[i];if(x<=0)return arr[i];}
    return arr[arr.length-1];
  };
  const give=(c,isHidden)=>{
    cnt[c.id]=(cnt[c.id]||0)+1;
    if(!state.cards.includes(c.id))state.cards.push(c.id);
    save();
    const dup=cnt[c.id]>1;
    const msg=isHidden
      ? '🔮 隠し図鑑を発見！ '+c.e+' '+c.n+(dup?'（重複 ×'+cnt[c.id]+'）':'')
      : '📖 新種はっけん！ '+c.e+' '+c.n+(dup?'（重複 ×'+cnt[c.id]+'）':(c.r==='SR'?'（超レア！）':c.r==='R'?'（レア）':''));
    setTimeout(()=>{toast(msg);pop(dup?6:20);},1400);
  };
  const hid=CARDS.filter(c=>c.r==='H');
  const newHid=hid.filter(c=>!owned(c.id));
  if(hid.length&&Math.random()<0.04){
    give(newHid.length?newHid[Math.floor(Math.random()*newHid.length)]
                      :hid[Math.floor(Math.random()*hid.length)],true);
    return;
  }
  const pool=CARDS.filter(c=>c.r!=='H');
  if(!pool.length)return;
  give(draw(pool),false);
}

const MAXLV=25;
function xpNeed(l){return 60*l+4*l*l;}
function lvlInfo(xp){
  let l=1,acc=0,need=xpNeed(1);
  while(l<MAXLV&&xp>=acc+need){acc+=need;l++;need=xpNeed(l);}
  if(l>=MAXLV)return{level:MAXLV,cur:Math.max(0,xp-acc),need:xpNeed(MAXLV),max:true};
  return{level:l,cur:xp-acc,need};
}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function touchStreak(){
  const t=todayStr();if(state.streak.day===t)return;
  const y=new Date(Date.now()-864e5);
  const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  state.streak.count=(state.streak.day===ys)?state.streak.count+1:1;
  state.streak.day=t;save();
  if(state.streak.count%7===0){toast('🔥 '+state.streak.count+'日連続達成！');grantCard();}
  else if(state.streak.count>=2)toast('🔥 '+state.streak.count+'日連続！');
  checkAch();
}

function checkCardMilestone(){

function bumpQ(){
  const t=todayStr();
  if(state.stat.day!==t){state.stat.day=t;state.stat.dayQ=0;}
  state.stat.dayQ++;
  const h=new Date().getHours();
  if(h<5)unlock('nightowl'); else if(h<8)unlock('earlybird');
  if(state.stat.dayQ>=50)unlock('marathon');
  save();
}
function checkAch(){
  if(!state.stat)state.stat={day:'',dayQ:0,fields:[],peakWeak:0};
  if(!state.stat.fields)state.stat.fields=[];
  if(state.stat.fields.length>=8)unlock('allfield');
  const _wk=weak().length;
  if(_wk>state.stat.peakWeak)state.stat.peakWeak=_wk;
  if(state.stat.peakWeak>=10&&_wk===0)unlock('comeback');
  const _cn=cardsNormal().filter(c=>(state.cardCount||{})[c.id]>0).length;
  if(_cn>=10)unlock('cards10');
  if(_cn>=30)unlock('cards30');
  if(_cn>=50)unlock('cards50');
  if(_cn>=cardsNormal().length)unlock('cardsall');
  if(CARDS.some(c=>c.r==='H'&&(state.cardCount||{})[c.id]>0))unlock('secretfind');
  const solved=Object.keys(state.stats).length;
  const lv=lvlInfo(state.xp).level;
  if(state.maxCombo>=5)unlock('combo5');
  if(state.maxCombo>=10)unlock('combo10');
  if(solved>=100)unlock('solve100');
  if(solved>=Q.length)unlock('solveall');
  if(iboCorrect()>=100)unlock('ibo100');
  if(state.taBest>=15)unlock('ta15');
  if(state.taBest>=20)unlock('ta20');
  if(state.taBest>=30)unlock('ta30');
  if(state.streak.count>=3)unlock('streak3');
  if(state.streak.count>=7)unlock('streak7');
  if(lv>=5)unlock('lv5');
  if(lv>=10)unlock('lv10');
}

  const raw=(document.getElementById('impText')||{}).value||'';
  if(!raw.trim()){toast('貼り付けてから読み込んでください');return;}
  let o; try{ o=JSON.parse(raw.trim()); }catch(e){ toast('形式が正しくありません'); return; }
  const d=o&&o.d?o.d:null;
  if(!d){toast('進捗データが見つかりません');return;}
  if(!confirm('いまの進捗を、貼り付けた内容で置きかえます。よろしいですか？'))return;
  state.xp=d.xp||0; state.maxCombo=d.maxCombo||0;
  state.ach=d.ach||[]; state.cards=d.cards||[]; state.stats=d.stats||{};
  state.best=d.best||{}; state.streak=d.streak||{day:'',count:0};
  state.taBest=d.taBest||0; state.cardMile=d.cardMile||0;
  save(); toast('進捗を復元しました ✓'); renderHome();
}
function renderBackup(){
  const solved=Object.keys(state.stats).length;
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="qhead"><h2>💾 進捗の保存</h2></div>
    <p class="help" style="margin-bottom:12px">学習の記録はこの端末の中だけに保存されています。機種変更のときや、ホーム画面のアイコンを入れ直すときは、ここで書き出して持ち出せます。</p>
    <div class="statcard" style="display:block;padding:16px">
      <div style="font-size:12px;color:var(--sub);font-weight:700;margin-bottom:8px">いまの記録（${solved}問 / Lv.${lvlInfo(state.xp).level} / ${state.xp.toLocaleString()} XP）</div>
      <textarea id="bkText" readonly style="width:100%;min-height:110px;font-size:11px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px">${exportProgress()}</textarea>
      <button class="btn btn-primary" style="margin-top:10px" onclick="copyProgress()">📋 コピーする</button>
    </div>
    <p class="help" style="margin:14px 0 8px">▼ 別の端末やアイコンで復元する場合は、上でコピーした内容をここに貼り付けます。</p>
    <div class="statcard" style="display:block;padding:16px">
      <textarea id="impText" placeholder="ここに貼り付け" style="width:100%;min-height:90px;font-size:11px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px"></textarea>
      <button class="btn btn-ghost" style="margin-top:10px" onclick="importProgress()">読み込む</button>
    </div>
    <p class="help" style="margin-top:10px">読み込むと、いまの記録は置きかえられます。</p>`;
}
function renderTitles(){
  const lv=lvlInfo(state.xp).level;
  const rows=EVO.map((t,i)=>{
    const n=i+1, got=n<=lv, cur=n===lv;
    const need=(()=>{let acc=0;for(let k=1;k<n;k++)acc+=xpNeed(k);return acc;})();
    return `<div class="evr ${got?'got':''} ${cur?'cur':''}">
      <span class="evn">${n}</span>
      <span class="eve">${got?t.e:'🔒'}</span>
      <div class="evb">
        <div class="evt">${got?esc(t.n):'？？？'}</div>
        <div class="evd">${cur?'いまここ':got?'到達済み':'必要 '+need.toLocaleString()+' XP'}</div>
      </div>
    </div>`;
  }).join('');
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ 戻る</button>
    <div class="qhead"><h2>🧬 進化の記録</h2><span class="combo" style="color:var(--accent)">${lv}/${EVO.length}</span></div>
    <p class="help" style="margin-bottom:12px">レベルが上がるたびに称号が進化する。生命の進化をたどり、その先は生物学者としての歩みに続く。</p>
    ${rows}
    <button class="btn btn-ghost" style="margin-top:10px" onclick="renderHome()">ホームに戻る</button>`;
}
function renderZukan(){
  const have=new Set(CARDS.filter(c=>(state.cardCount||{})[c.id]>0).map(c=>c.id));
  const norm=cardsNormal();
  const got=norm.filter(c=>have.has(c.id)).length;
  const sec=(r,label)=>{
    const cs=CARDS.filter(c=>c.r===r);
    return `<div class="label">${label}（${cs.filter(c=>have.has(c.id)).length}/${cs.length}）</div>`+
      cs.map(c=>have.has(c.id)
        ?`<div class="zkr got"><span class="zke">${c.e}</span><div class="zkb"><div class="zkn">${c.n}${(state.cardCount&&state.cardCount[c.id]>1)?` <span class="dupn">×${state.cardCount[c.id]}</span>`:''} <span class="zktag ${c.r}">${c.r==='SR'?'超レア':c.r==='R'?'レア':'ふつう'}</span></div><div class="zkd">${c.d}</div></div></div>`
        :`<div class="zkr"><span class="zke">🔒</span><div class="zkb"><div class="zkn" style="color:var(--sub)">？？？</div><div class="zkd">レベルアップ・実績・正解数の節目で手に入る</div></div></div>`).join('');
  };
  const hid=CARDS.filter(c=>c.r==='H'&&(state.cardCount||{})[c.id]>0);
  const hidSec=hid.length?`<div class="label">🔮 隠し図鑑（${hid.length}）</div>`+
    hid.map(c=>`<div class="zkr got" style="border-color:#7B8BFF"><span class="zke">${c.e}</span><div class="zkb"><div class="zkn">${c.n}${(state.cardCount&&state.cardCount[c.id]>1)?` <span class="dupn">×${state.cardCount[c.id]}</span>`:''} <span class="zktag H">隠し</span></div><div class="zkd">${c.d}</div></div></div>`).join(''):'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="qhead"><h2>📖 生物図鑑</h2><span class="combo" style="color:var(--accent)">${got}/${norm.length} 発見</span></div>
    ${got>=norm.length?'<div class="statcard" style="justify-content:center"><b style="color:var(--accent)">🏆 コンプリート！</b></div>':''}
    <p class="help" style="margin-bottom:10px">生きものや生命科学にまつわる豆知識を集める図鑑。レベルアップ（2つごと）・実績解除・正解数の節目・7日連続学習で手に入る。</p>
    ${hidSec}
    ${sec('SR','⭐ 超レア')}
    ${sec('R','🔹 レア')}
    ${sec('N','・ ふつう')}`;
}

let g={list:[],i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:false,t:0,timer:null,field:'all'};
function startQuiz(field,ta){
  let list;
  if(field==='weak'){list=shuffle(weak());if(!list.length){toast('苦手はまだないよ');return;}list=list.slice(0,10);}
  else{list=pool(field,curLv);
    if(list.length<4){toast('この条件の問題が足りないよ');return;}
    list=shuffle(list).slice(0,ta?40:10);}
  g={list,i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:!!ta,t:ta?60:0,timer:null,field};
  renderQuiz();
}
function renderQuiz(){
  if(g.i>=g.list.length)return finish();
  clearInterval(g.timer);
  const q=g.list[g.i];g.answered=false;
  const opts=shuffle(q.ch.map((c,k)=>({c,k})));
  screen.innerHTML=`
    <button class="back" onclick="quitQuiz()">‹ もどる</button>
    <div class="qhead"><div class="left"><h2>${g.ta?'⏱ タイムアタック':'📝 クイズ'}</h2>
      ${g.combo>=2?`<span class="combo">🔥 ${g.combo}コンボ</span>`:''}</div>
      ${g.ta?`<span class="timer" id="tm">${g.t}</span>`:`<span class="combo">${g.i+1}/${g.list.length}</span>`}</div>
    <div class="bar-top"><i style="width:${g.i/g.list.length*100}%"></i></div>
    <div class="qcard">
      <div class="qmeta"><span class="tagf">${esc(fieldName(q.f))}</span><span class="taglv ${q.lv}">${LV[q.lv].n}</span></div>
      <div class="qtext">${esc(q.q)}</div>
    </div>
    <div class="choices">${opts.map(o=>`<button class="choice" data-k="${o.k}" onclick="answer(${o.k})">${esc(o.c)}</button>`).join('')}</div>
    <div id="fb"></div>`;
  if(g.ta){g.timer=setInterval(()=>{g.t--;const el=$('tm');
    if(el){el.textContent=g.t;if(g.t<=5)el.classList.add('warn');}
    if(g.t<=0){clearInterval(g.timer);g.answered=true;finish();}},1000);}
}
function answer(k){
  if(g.answered)return;g.answered=true;clearInterval(g.timer);
  const q=g.list[g.i],ok=k===q.a;
  document.querySelectorAll('.choice').forEach(b=>{const kk=+b.dataset.k;
    if(kk===q.a)b.classList.add('correct');else if(kk===k)b.classList.add('wrong');else b.classList.add('dim');b.onclick=null;});
  const st=state.stats[q.id]||{c:0,w:0};
  bumpQ();
  if(!state.stat.fields)state.stat.fields=[];
  if(!state.stat.fields.includes(q.f))state.stat.fields.push(q.f);
  if(ok)setTimeout(checkCardMilestone,50);
  if(ok){g.score++;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);
    if(g.combo>state.maxCombo)state.maxCombo=g.combo;
    st.c++;
    addXp(XPLV[q.lv]+(g.combo>=5?10:g.combo>=3?5:0));touchStreak();
    pop(g.combo>=3?14:8);}
  else{g.combo=0;g.miss.push(q);st.w++;}
  state.stats[q.id]=st;save();
  const head=k===-1?'⏰ 時間切れ':(ok?'⭕ 正解':'❌ 不正解');
  $('fb').innerHTML=`<div class="exp"><b>${head}</b>　${esc(q.ex)}</div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="next()">次へ ›</button>`;
  $('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){g.i++;renderQuiz();}
function quitQuiz(){clearInterval(g.timer);renderHome();}
function finish(){
  clearInterval(g.timer);
  const total=g.list.length,rate=Math.round(g.score/total*100),rk=rankOf(rate);
  const key=(g.field||'all')+'_'+curLv+(g.ta?'_ta':'');
  const prev=state.best[key]||0;const isBest=g.score>prev;
  if(isBest){state.best[key]=g.score;save();}
  unlock('first');
  if(g.ta&&g.score>state.taBest){state.taBest=g.score;save();}
  if(!g.ta&&total>=10&&g.score===total)unlock('perfect');
  checkAch();
  const msg={S:'完璧！文句なし',A:'すばらしい理解度',B:'いい調子、あと少し',C:'解説を読んで固めよう',D:'まずは易しめから'}[rk];
  const miss=g.miss.length?`<div class="label" style="margin-top:4px">まちがえた問題</div>
    <div class="misslist">${g.miss.map(q=>`<div class="r"><div class="q">${esc(q.q)}</div><div class="a">正解: ${esc(q.ch[q.a])}</div></div>`).join('')}</div>`:'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="result">
      <div class="rank">${rk}</div>
      <div class="big">${g.score}<span style="font-size:22px;color:var(--sub)">/${total}</span></div>
      <h2>${msg}</h2>
      <p>正答率 ${rate}% ／ 最大 ${g.maxCombo} コンボ</p>
      ${isBest?'<p style="color:var(--accent);font-weight:800">🏅 自己ベスト更新！</p>':`<p>この条件のベスト: ${Math.max(prev,g.score)}問</p>`}
    </div>
    ${miss}
    <div class="row2" style="margin-top:8px">
      <button class="btn btn-ghost" onclick="renderHome()">ホーム</button>
      <button class="btn btn-primary" onclick="startQuiz('${g.field}',${g.ta})">もう一回</button>
    </div>`;
  if(rate>=85)setTimeout(()=>pop(18),200);
}
renderHome();
setTimeout(()=>checkUpdate(true),1500);
</script>
